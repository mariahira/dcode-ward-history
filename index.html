<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"/>
<meta name="theme-color" content="#1A3557"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Dcode Ward"/>
<link rel="manifest" href="manifest.json"/>
<link rel="apple-touch-icon" href="icon-180.png"/>
<title>Dcode Ward History</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:Georgia,serif;background:#F0F4F8;color:#1E2D3D;}
button{cursor:pointer;}
button:active{transform:scale(0.97);}
textarea,input,select{font-family:Georgia,serif;}
textarea:focus,input:focus,select:focus{outline:2px solid #2E8B8B;}
::-webkit-scrollbar{width:5px;}
::-webkit-scrollbar-thumb{background:#DCE8F0;border-radius:10px;}
.header{background:linear-gradient(135deg,#1A3557,#1E4976);padding:14px 16px 10px;position:sticky;top:0;z-index:100;box-shadow:0 4px 20px rgba(26,53,87,.3);}
.tabs{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;}
.tab-btn{padding:5px 14px;border-radius:20px;border:none;font-size:11px;font-family:monospace;transition:all .2s;}
.tab-btn.active{background:#fff;color:#1A3557;font-weight:bold;}
.tab-btn:not(.active){background:rgba(255,255,255,.12);color:rgba(255,255,255,.8);}
.main{max-width:900px;margin:0 auto;padding:20px 14px 50px;}
.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:#1A3557;color:#fff;border:1px solid #2E8B8B;padding:9px 22px;border-radius:28px;z-index:3000;font-family:monospace;font-size:12px;box-shadow:0 5px 20px rgba(0,0,0,.15);white-space:nowrap;}
.card{background:#fff;border-radius:18px;box-shadow:0 6px 24px rgba(26,53,87,.1);overflow:hidden;margin-bottom:16px;border:1px solid #DCE8F0;}
.progress-bar{height:6px;background:#DCE8F0;border-radius:10px;overflow:hidden;margin-bottom:18px;}
.pills{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;}
.pill{padding:5px 14px;border-radius:20px;border:2px solid;font-size:11px;font-weight:bold;font-family:monospace;}
.q-item{display:flex;gap:10px;padding:11px 14px;border-radius:11px;border-left:4px solid;margin-bottom:9px;align-items:flex-start;}
.q-num{border-radius:50%;width:20px;height:20px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:bold;flex-shrink:0;margin-top:2px;color:#fff;}
.tip-box{background:#FFFBF0;border:1px solid #F5D87A;border-radius:11px;padding:12px 16px;margin-top:16px;}
.mnem-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px;margin-top:10px;}
.flow-row{display:flex;align-items:center;flex-wrap:wrap;gap:5px;margin-top:12px;}
.flow-item{display:flex;flex-direction:column;align-items:center;gap:3px;border:2px solid;border-radius:11px;padding:8px 10px;min-width:52px;}
.greeting-script{background:#F7FAFC;border-left:4px solid #2E8B8B;border-radius:0 11px 11px 0;padding:14px 18px;margin:10px 0;font-style:italic;line-height:1.8;font-size:14px;}
.inp{width:100%;padding:10px 13px;background:#F0F4F8;border:1.5px solid #DCE8F0;border-radius:9px;color:#1E2D3D;font-size:13px;margin-bottom:11px;box-sizing:border-box;}
.sel{width:100%;padding:9px 12px;background:#F0F4F8;border:1.5px solid #DCE8F0;border-radius:9px;color:#1E2D3D;font-size:12px;font-family:monospace;margin-bottom:10px;box-sizing:border-box;}
.ta{width:100%;background:#F0F4F8;border:1.5px solid #DCE8F0;border-radius:9px;color:#1E2D3D;font-size:13px;resize:vertical;box-sizing:border-box;padding:10px 12px;}
.login-card{background:#fff;border:1px solid #DCE8F0;border-radius:18px;padding:30px;width:100%;max-width:400px;box-shadow:0 8px 36px rgba(26,53,87,.12);}
.login-center{display:flex;align-items:center;justify-content:center;min-height:55vh;}
.submit-btn{width:100%;padding:12px;background:linear-gradient(135deg,#1A3557,#1E4976);border:none;border-radius:11px;color:#fff;font-weight:bold;font-size:14px;font-family:monospace;}
.idea-card{background:#fff;border-radius:12px;padding:18px;border:1px solid #DCE8F0;margin-bottom:10px;}
.note-card{background:#fff;border-radius:12px;overflow:hidden;border:1px solid #DCE8F0;margin-bottom:12px;}
.print-modal{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:1000;display:flex;align-items:center;justify-content:center;padding:14px;}
.print-inner{background:#fff;border-radius:16px;max-width:700px;width:100%;max-height:90vh;overflow:auto;}
.print-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px;}
.score-box{background:#fff;border:2px solid #4CAF7D;border-radius:12px;padding:7px 18px;text-align:center;}
.reveal-btn{width:100%;padding:13px;border:none;border-radius:11px;color:#fff;font-weight:bold;font-size:13px;font-family:monospace;}
.answer-box{background:#EAF6EF;border:1.5px solid #4CAF7D;border-radius:11px;padding:14px 18px;font-size:14px;line-height:1.7;color:#2D6A4F;margin-bottom:16px;}
.login-wall{background:#F7FAFC;border:2px dashed #DCE8F0;border-radius:12px;padding:24px;text-align:center;margin-bottom:18px;}
.footer{text-align:center;padding:14px;font-family:monospace;font-size:10px;color:#6B8299;border-top:1px solid #DCE8F0;background:#fff;}
@media print{header,.tabs,.footer,button{display:none!important;}}
</style>
</head>
<body>
<div id="app"></div>
<script>
// ── COLORS & DATA ──────────────────────────────────────────
const C={navy:"#1A3557",teal:"#2E8B8B",cyan:"#3AAFCF",lime:"#4CAF7D",amber:"#F5A623",rose:"#D95F7A",purple:"#7B6FCC",orange:"#E07B4A",muted:"#6B8299",border:"#DCE8F0",lightBg:"#F7FAFC"};

const STEPS=[
  {id:"pc",code:"PC",emoji:"🩺",color:C.teal,light:"#E8F6F6",title:"Presenting Complaint",title_bn:"প্রধান অভিযোগ",subtitle:"Chief reason — in the patient's own words",subtitle_bn:"রোগীর নিজের ভাষায় আসার কারণ",audio:"Presenting Complaint",
   prompts:[{en:"What brings you to the hospital today?",bn:"আজ আপনি কোন সমস্যার জন্য হাসপাতালে এসেছেন?"},{en:"What is your main complaint?",bn:"আপনার প্রধান উপসর্গটি কী?"},{en:"How long have you been experiencing this problem?",bn:"এই সমস্যাটি কতদিন ধরে বিদ্যমান?"}],
   tip:{en:"Use open-ended questions. Let the patient speak first.",bn:"উন্মুক্ত প্রশ্ন করুন। রোগীকে প্রথমে কথা বলতে দিন।"},mnemonics:[],
   practice:[{scenario:"A 45-year-old man walks in holding his chest.",answer:"Start with 'What brings you in today?' — let him describe in his own words first."},{scenario:"An elderly woman says 'I don't feel well.'",answer:"Ask 'Can you tell me more?' — avoid yes/no questions at this stage."}]},
  {id:"hpc",code:"HPC",emoji:"🔬",color:C.cyan,light:"#EAF6FB",title:"History of Presenting Complaint",title_bn:"বর্তমান অভিযোগের ইতিহাস",subtitle:"Deep-dive using SOCRATES framework",subtitle_bn:"SOCRATES পদ্ধতিতে বিশ্লেষণ",audio:"History of Presenting Complaint",
   prompts:[{en:"When exactly did it start?",bn:"এটা ঠিক কখন শুরু হয়েছিল?"},{en:"Did it come on suddenly or gradually?",bn:"হঠাৎ নাকি আস্তে আস্তে?"},{en:"What makes it better or worse?",bn:"কিসে ভালো বা খারাপ হয়?"},{en:"Rate severity 1-10.",bn:"১ থেকে ১০ এ কতটুকু?"}],
   tip:{en:"Always ask about associated symptoms — never stop at the chief complaint.",bn:"সংশ্লিষ্ট উপসর্গ সম্পর্কে সবসময় জিজ্ঞেস করুন।"},
   mnemonics:[{name:"SOCRATES",items:["Site","Onset","Character","Radiation","Associations","Time course","Exacerbating/Relieving","Severity"]}],
   practice:[{scenario:"Patient says: 'I have chest pain.'",answer:"Use SOCRATES — Site? Onset? Character? Radiation to arm/jaw? What makes it worse?"},{scenario:"Patient says: 'I have a headache.'",answer:"How long? Where? Throbbing? Light sensitivity? Nausea? Neck stiffness?"}]},
  {id:"pmh",code:"PMH",emoji:"📋",color:C.lime,light:"#EAF6EF",title:"Past Medical History",title_bn:"পূর্ববর্তী চিকিৎসা ইতিহাস",subtitle:"Previous illnesses, surgeries, hospitalizations",subtitle_bn:"আগের রোগ, অপারেশন ও হাসপাতাল ভর্তি",audio:"Past Medical History",
   prompts:[{en:"Any known medical conditions?",bn:"আপনার পূর্ব থেকে কোনো রোগ বা চিকিৎসাজনিত সমস্যা আছে কি?"},{en:"Ever been admitted to hospital?",bn:"আপনি কি আগে কখনো হাসপাতালে ভর্তি হয়েছেন?"},{en:"Any previous operations?",bn:"আপনার কি আগে কোনো অস্ত্রোপচার হয়েছে?"}],
   tip:{en:"Ask systematically about chronic diseases such as DM, HTN, TB, thyroid disorders and asthma.",bn:"ডায়াবেটিস, উচ্চ রক্তচাপ, টিবি, থাইরয়েড রোগ ও অ্যাজমার মতো দীর্ঘমেয়াদী রোগসমূহ সম্পর্কে সুনির্দিষ্টভাবে জিজ্ঞেস করুন।"},
   mnemonics:[{name:"MJ THREADS",items:["MI","Jaundice","TB","HTN","Rheumatic fever","Epilepsy","Asthma","Diabetes","Stroke"]}],
   practice:[{scenario:"Patient denies any past illnesses.",answer:"Probe: 'Any blood pressure? Diabetes? TB or jaundice?' Direct questions unlock forgotten history."}]},
  {id:"dh",code:"DH",emoji:"💊",color:C.purple,light:"#F0EEF9",title:"Drug History & Allergies",title_bn:"ওষুধের ইতিহাস ও অ্যালার্জি",subtitle:"Medications, OTC drugs, supplements & allergies",subtitle_bn:"ওষুধ, ভিটামিন, সাপ্লিমেন্ট এবং অ্যালার্জি",audio:"Drug History and Allergies",
   prompts:[{en:"Any current medications including OTC?",bn:"বর্তমানে কোনো ওষুধ খাচ্ছেন?"},{en:"Any herbal or traditional remedies?",bn:"ভেষজ বা দেশীয় ওষুধ খাচ্ছেন?"},{en:"Any known allergies? What happens?",bn:"অ্যালার্জি আছে? কী হয় তখন?"}],
   tip:{en:"Distinguish true allergy from side effect. Note dose and compliance.",bn:"অ্যালার্জি ও পার্শ্বপ্রতিক্রিয়ার পার্থক্য করুন।"},mnemonics:[],
   practice:[{scenario:"Patient says 'I'm allergic to penicillin.'",answer:"Ask 'What exactly happens?' Distinguish rash/anaphylaxis (true allergy) from GI upset (intolerance)."}]},
  {id:"fh",code:"FH",emoji:"👪",color:C.amber,light:"#FEF6E4",title:"Family History",title_bn:"পারিবারিক ইতিহাস",subtitle:"Hereditary conditions in close relatives",subtitle_bn:"নিকটাত্মীয়দের বংশগত রোগের ইতিহাস",audio:"Family History",
   prompts:[{en:"Any significant illness in your family?",bn:"পরিবারের মধ্যে কোনো দীর্ঘমেয়াদী রোগ আছে কি?"},{en:"Are your parents alive? If deceased, what was the cause?",bn:"আপনার বাবা-মা কি জীবিত? যদি না থাকেন, মৃত্যুর কারণ কী ছিল?"},{en:"Any family history of diabetes, hypertension, thyroid disease, heart disease or malignancy?",bn:"পরিবারে ডায়াবেটিস, উচ্চ রক্তচাপ, থাইরয়েড রোগ, হৃদরোগ বা ক্যান্সারের ইতিহাস আছে কি?"}],
   tip:{en:"Focus on first-degree relatives: parents, siblings, children.",bn:"প্রথম-স্তরের আত্মীয়: বাবা-মা, ভাই-বোন, সন্তান।"},mnemonics:[],
   practice:[{scenario:"Young patient with chest pain, father died at 50.",answer:"Explore family cardiac history — premature CAD is hereditary. Ask about cholesterol, sudden deaths."}]},
  {id:"sh",code:"SH",emoji:"🏙",color:C.orange,light:"#FDF0E8",title:"Social History",title_bn:"সামাজিক ইতিহাস",subtitle:"Occupation, lifestyle, habits & support system",subtitle_bn:"পেশা, জীবনযাত্রা, অভ্যাস ও সামাজিক সহায়তা",audio:"Social History",
   prompts:[{en:"What is your occupation?",bn:"আপনার পেশা কী?"},{en:"Do you smoke or use tobacco?",bn:"ধূমপান বা তামাক সেবন করেন?"},{en:"Do you drink alcohol? How much per week?",bn:"মদ্যপান করেন? সপ্তাহে কতটুকু?"},{en:"Who lives with you at home?",bn:"বাড়িতে কারা থাকেন?"}],
   tip:{en:"Be non-judgmental. Ask 'How much per week?' not 'Do you drink a lot?'",bn:"বিচার না করে জিজ্ঞেস করুন।"},
   mnemonics:[{name:"SADMA",items:["Smoking","Alcohol","Drugs","Marital status","Activity/Occupation"]}],
   practice:[{scenario:"Patient seems reluctant to discuss habits.",answer:"Normalize: 'I ask everyone this so I can give the best care.' Non-judgmental tone opens doors."}]},
  {id:"ros",code:"ROS",emoji:"⚕",color:C.rose,light:"#FAEAEE",title:"Review of Systems",title_bn:"সিস্টেম রিভিউ",subtitle:"Systematic screening of all body systems",subtitle_bn:"সমস্ত অঙ্গতন্ত্রের পদ্ধতিগত পর্যালোচনা",audio:"Review of Systems",
   prompts:[{en:"Any headaches, dizziness, or vision changes?",bn:"মাথাব্যথা, মাথা ঘোরা বা দৃষ্টি পরিবর্তন?"},{en:"Any chest pain or shortness of breath?",bn:"বুকে ব্যথা বা শ্বাসকষ্ট?"},{en:"Any nausea, vomiting, or bowel changes?",bn:"বমি ভাব, বমি বা পেটের সমস্যা?"},{en:"Any urinary symptoms?",bn:"প্রস্রাবের কোনো সমস্যা?"}],
   tip:{en:"Screen by system — only drill deeper if positive.",bn:"প্রতিটি সিস্টেম স্ক্রিন করুন — পজিটিভ হলেই বিস্তারিত।"},mnemonics:[],
   practice:[{scenario:"You've completed HPC for abdominal pain.",answer:"Now screen: chest pain? urinary symptoms? fever? Systematic screening catches what focused history misses."}]}
];

// ── STATE — all persisted in localStorage ─────────────────
const LS={
  get(k,def){try{const v=localStorage.getItem(k);return v?JSON.parse(v):def;}catch{return def;}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch{}}
};

let state={
  tab:"greeting",
  si:LS.get("si",0),
  lang:LS.get("lang","both"),
  mnem:null,
  user:LS.get("user",null),        // persists login!
  ideas:LS.get("ideas",[
    {id:1,author:"Rafiq - DMCH",step:"HPC",text:"Ask patient to point on a body diagram — faster than verbal description.",bn:"রোগীকে শরীরের ছবিতে আঙুল দিয়ে ব্যথার জায়গা দেখাতে বলুন।",likes:18},
    {id:2,author:"Priya - Chittagong",step:"SH",text:"Ask 'How much per week?' not 'Do you drink a lot?' — more honest answers.",bn:"'সপ্তাহে কতটা?' জিজ্ঞেস করুন।",likes:25},
    {id:3,author:"Lin - BIRDEM",step:"PMH",text:"Start PMH with 'Apart from this, how is your general health?'",bn:"'এই সমস্যা বাদে স্বাস্থ্য কেমন?' দিয়ে শুরু করুন।",likes:12}
  ]),
  liked:LS.get("liked",[]),
  notes:LS.get("notes",{}),
  newStep:"HPC",newText:"",newEn:"",
  toast:"",copied:false,showPrint:false,
  pi:0,showAns:false,score:{c:0,t:0},
  // login form
  lv:"login",fname:"",femail:"",fpass:"",ferr:""
};

function save(){
  LS.set("si",state.si);
  LS.set("lang",state.lang);
  LS.set("user",state.user);
  LS.set("ideas",state.ideas);
  LS.set("liked",state.liked);
  LS.set("notes",state.notes);
}

function speak(t){if(!window.speechSynthesis)return;window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="en-US";u.rate=0.87;window.speechSynthesis.speak(u);}
function toast(m){state.toast=m;render();setTimeout(()=>{state.toast="";render();},2200);}

// ── RENDER ─────────────────────────────────────────────────
function render(){
  const s=STEPS[state.si];
  const L=state.lang;
  const u=state.user;
  const allP=STEPS.flatMap(x=>x.practice.map(p=>({...p,color:x.color,emoji:x.emoji,light:x.light,code:x.code})));
  const curP=allP[state.pi%allP.length];

  document.getElementById("app").innerHTML=`
  ${state.toast?`<div class="toast">${state.toast}</div>`:""}
  ${state.showPrint?printModal():""}

  <header class="header">
    <div style="max-width:900px;margin:0 auto">
      <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px">
        <div style="display:flex;align-items:center;gap:10px">
          <div style="background:rgba(255,255,255,.15);border:2px solid rgba(255,255,255,.25);border-radius:12px;padding:7px 11px;font-size:22px">⚕</div>
          <div>
            <div style="font-size:17px;font-weight:bold;font-family:monospace;color:#fff">Dcode Ward History</div>
            <div style="font-size:9px;color:rgba(255,255,255,.6);font-family:monospace">ডিকোড ওয়ার্ড হিস্ট্রি · BD & International</div>
          </div>
        </div>
        <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">
          <div style="display:flex;background:rgba(255,255,255,.1);border-radius:20px;padding:3px;gap:2px">
            ${["both","en","bn"].map(v=>`<button style="padding:3px 10px;border-radius:16px;border:none;font-size:10px;font-weight:bold;cursor:pointer;background:${state.lang===v?"#fff":"transparent"};color:${state.lang===v?"#1A3557":"rgba(255,255,255,.75)"}" onclick="state.lang='${v}';save();render()">${v==="both"?"EN+বাং":v.toUpperCase()}</button>`).join("")}
          </div>
          <button style="padding:5px 12px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:20px;font-size:11px;font-family:monospace" onclick="state.showPrint=true;render()">🖨 Print</button>
          ${u
            ?`<div style="display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:20px;padding:4px 12px">
                <span style="font-size:14px">👤</span>
                <span style="font-size:11px;color:#fff;font-family:monospace">${u.name.split(" ")[0]}</span>
                <button style="background:none;border:none;color:rgba(255,255,255,.5);font-size:10px;font-family:monospace;cursor:pointer" onclick="state.user=null;save();render()">out</button>
              </div>`
            :`<button style="padding:6px 14px;background:rgba(255,255,255,.95);border:none;color:#1A3557;border-radius:20px;font-size:11px;font-family:monospace;font-weight:bold" onclick="state.tab='login';render()">🔐 Login</button>`
          }
        </div>
      </div>
      <div class="tabs">
        ${[["greeting","👋 Greeting & PP"],["guide","📖 Guide"],["practice","🏋 Practice"],["community","💬 Community"],["notepad","📝 Notepad"]].map(([t,l])=>`<button class="tab-btn ${state.tab===t?"active":""}" onclick="state.tab='${t}';render()">${l}</button>`).join("")}
      </div>
    </div>
  </header>

  <div class="main">
    ${state.tab==="greeting"?greetingTab(L):""}
    ${state.tab==="guide"?guideTab(s,L):""}
    ${state.tab==="practice"?practiceTab(curP,allP):""}
    ${state.tab==="community"?communityTab(u):""}
    ${state.tab==="notepad"?notepadTab(u):""}

  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap;gap:10px">
    <div>
      <h2 style="font-family:monospace;color:${C.navy};margin:0;font-size:14px;letter-spacing:2px;text-transform:uppercase">📝 Patient Notepad</h2>
      <p style="color:${C.muted};font-size:11px;margin:3px 0 0;font-family:monospace">${u?"Notes saved to your account ✅":"Notes saved on this device"}</p>
    </div>
    <button style="padding:8px 18px;background:${state.copied?C.lime:C.navy};color:#fff;border:none;border-radius:9px;font-family:monospace;font-size:11px;font-weight:bold;transition:background .3s" onclick="copyNotes()">${state.copied?"✓ Copied!":"⬆ Copy All"}</button>
  </div>
  ${STEPS.map(s=>`
  <div class="note-card">
    <div style="background:linear-gradient(135deg,${s.color},${s.color}bb);padding:9px 16px;display:flex;align-items:center;gap:7px">
      <span style="font-size:14px">${s.emoji}</span>
      <div>
        <span style="font-family:monospace;font-weight:bold;font-size:12px;color:#fff">${s.code} — ${s.title}</span>
        <div style="font-size:9px;color:rgba(255,255,255,.75)">${s.title_bn}</div>
      </div>
    </div>
    <textarea rows="3" style="width:100%;padding:12px 16px;border:none;font-family:Georgia,serif;font-size:13px;line-height:1.7;resize:vertical;box-sizing:border-box;color:#1E2D3D;background:#F7FAFC" placeholder="Notes for ${s.title}..." oninput="saveNote('${s.id}',this.value)">${state.notes[s.id]||""}</textarea>
  </div>`).join("")}`;
}

// ── LOGIN TAB ──────────────────────────────────────────────
function loginTab(){
  return `<div class="login-center">
  <div class="login-card">
    <div style="text-align:center;margin-bottom:24px">
      <div style="font-size:36px;margin-bottom:7px">🔐</div>
      <div style="font-size:18px;font-weight:bold;font-family:monospace;color:${C.navy}">${state.lv==="login"?"Welcome Back":"Create Account"}</div>
      <div style="font-size:11px;color:${C.muted};margin-top:3px">Login stays even after closing the app ✅</div>
    </div>
    ${state.ferr?`<div style="background:#FEE8ED;border:1px solid #F8B4C2;color:${C.rose};border-radius:7px;padding:7px 12px;font-size:11px;margin-bottom:12px;text-align:center">${state.ferr}</div>`:""}
    ${state.lv==="signup"?`<input class="inp" type="text" placeholder="Your full name" value="${state.fname}" oninput="state.fname=this.value"/>`:""}
    <input class="inp" type="email" placeholder="Email address" value="${state.femail}" oninput="state.femail=this.value"/>
    <input class="inp" type="password" placeholder="Password (min 6 characters)" style="margin-bottom:20px" value="${state.fpass}" oninput="state.fpass=this.value"/>
    <button class="submit-btn" onclick="doLogin()">${state.lv==="login"?"🔐 Login":"🚀 Create Account"}</button>
    <div style="text-align:center;margin-top:14px;font-size:12px;color:${C.muted}">
      ${state.lv==="login"?"Don't have an account? ":"Already have an account? "}
      <button style="background:none;border:none;color:${C.teal};cursor:pointer;font-size:12px;font-family:monospace;text-decoration:underline" onclick="state.lv=state.lv==='login'?'signup':'login';state.ferr='';render()">
        ${state.lv==="login"?"Sign Up Free":"Login"}
      </button>
    </div>
  </div></div>`;
}

// ── PRINT MODAL ────────────────────────────────────────────

      <button style="background:rgba(255,255,255,.15);border:none;color:#fff;border-radius:7px;padding:5px 12px;font-size:12px" onclick="state.showPrint=false;render()">✕ Close</button>
    </div>
    <div style="padding:20px">
      <div style="text-align:center;margin-bottom:14px">
        <div style="font-size:18px;font-weight:bold;color:#1A3557;font-family:Georgia,serif">⚕ Dcode Ward History</div>
        <div style="font-size:10px;color:#888;margin-top:2px">Patient History-Taking · EN + বাংলা · By Maria Sultana Hira</div>
      </div>
      <div class="print-grid">
        ${STEPS.map(s=>`
        <div style="border:2px solid ${s.color};border-radius:9px;overflow:hidden">
          <div style="background:${s.color};padding:7px 11px;display:flex;gap:7px;align-items:center">
            <span style="font-size:13px">${s.emoji}</span>
            <div><div style="color:#fff;font-weight:bold;font-size:11px">${s.code} — ${s.title}</div><div style="color:rgba(255,255,255,.85);font-size:8px">${s.title_bn}</div></div>
          </div>
          <div style="padding:9px 11px;background:#fafafa">
            ${s.prompts.slice(0,3).map(p=>`<div style="border-left:3px solid ${s.color};padding-left:6px;margin-bottom:4px"><div style="font-size:9px;color:#222;line-height:1.4">${p.en}</div><div style="font-size:8px;color:#777">${p.bn}</div></div>`).join("")}
            ${s.mnemonics.map(m=>`<div style="margin-top:5px;background:${s.color}18;border-radius:5px;padding:4px 8px"><div style="font-size:8px;font-weight:bold;color:${s.color};margin-bottom:2px">🧠 ${m.name}</div><div style="display:flex;flex-wrap:wrap;gap:2px">${m.items.map(it=>`<span style="background:${s.color};color:#fff;border-radius:3px;padding:1px 5px;font-size:7px"><b>${it[0]}</b>${it.slice(1)}</span>`).join("")}</div></div>`).join("")}
            <div style="margin-top:5px;font-size:8px;color:#555;font-style:italic;border-top:1px dashed #e0e0e0;padding-top:4px">💡 ${s.tip.en}</div>
          </div>
        </div>`).join("")}
      </div>
      <div style="margin-top:12px;text-align:center;font-size:8px;color:#aaa;border-top:1px solid #eee;padding-top:8px">Dcode Ward History · Created by Maria Sultana Hira · Always verify with your clinical supervisor</div>
    </div>
    <div style="padding:11px 20px;border-top:1px solid #eee;display:flex;justify-content:flex-end;background:#f9f9f9;border-radius:0 0 16px 16px">
      <button style="padding:9px 24px;background:${C.teal};color:#fff;border:none;border-radius:9px;font-weight:bold;font-size:13px" onclick="window.print()">🖨 Print / Save PDF</button>
    </div>
  </div></div>`;
}

// ── ACTIONS ────────────────────────────────────────────────
function toggleLike(id,isLiked,isLoggedIn){
  if(!isLoggedIn){toast("🔐 Please login to like ideas!");return;}
  if(isLiked){
    state.liked=state.liked.filter(x=>x!==id);
    state.ideas=state.ideas.map(i=>i.id===id?{...i,likes:i.likes-1}:i);
  }else{
    state.liked=[...state.liked,id];
    state.ideas=state.ideas.map(i=>i.id===id?{...i,likes:i.likes+1}:i);
  }
  save();render();
}

function postIdea(){
  if(!state.user){toast("🔐 Please login to post!");return;}
  if(!state.newText.trim())return;
  const idea={id:Date.now(),author:state.user.name,step:state.newStep,text:state.newText,bn:state.newEn,likes:0};
  state.ideas=[idea,...state.ideas];
  state.newText="";state.newEn="";
  save();toast("✅ Posted!");
}

function saveNote(id,val){
  state.notes[id]=val;
  save();
}

function copyNotes(){
  const txt=STEPS.map(s=>"## "+s.title+"\n"+(state.notes[s.id]||"(empty)")).join("\n\n");
  navigator.clipboard.writeText(txt).catch(()=>{});
  state.copied=true;render();
  toast("📋 Notes copied!");
  setTimeout(()=>{state.copied=false;render();},2200);
}

function doLogin(){
  if(!state.femail||!state.fpass){state.ferr="Please fill all fields.";render();return;}
  if(state.fpass.length<6){state.ferr="Password must be at least 6 characters.";render();return;}
  if(state.lv==="signup"&&!state.fname.trim()){state.ferr="Please enter your name.";render();return;}
  const name=state.lv==="signup"?state.fname:state.femail.split("@")[0];
  state.user={name,email:state.femail};
  state.ferr="";state.tab="guide";
  save();
  toast("👋 Welcome, "+name+"! Login saved ✅");
}

// ── INIT ───────────────────────────────────────────────────
render();
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
</script>
</body>
</html>
