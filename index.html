<!-- Firebase -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
  import { getFirestore, doc, setDoc, getDoc, collection, getDocs, addDoc, updateDoc, increment } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAvgkCUO_RaDKcsdm6BNbvEc6YODQO0Tn8",
    authDomain: "dcode-ward-history.firebaseapp.com",
    projectId: "dcode-ward-history",
    storageBucket: "dcode-ward-history.firebasestorage.app",
    messagingSenderId: "271415465873",
    appId: "1:271415465873:web:784430636435e8c92d2c30"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);
  const provider = new GoogleAuthProvider();

  // ── AUTH STATE ─────────────────────────────────────────────
  onAuthStateChanged(auth, async (user) => {
    if (user) {
      window._user = { name: user.displayName, email: user.email, photo: user.photoURL, uid: user.uid };
      // Save user to Firestore
      await setDoc(doc(db, "users", user.uid), { name: user.displayName, email: user.email }, { merge: true });
      // Load saved notes
      const notesDoc = await getDoc(doc(db, "notes", user.uid));
      if (notesDoc.exists()) window._savedNotes = notesDoc.data();
    } else {
      window._user = null;
    }
    if (window._appReady) window._render();
  });

  // ── GOOGLE LOGIN ───────────────────────────────────────────
  window._googleLogin = async () => {
    try {
      await signInWithPopup(auth, provider);
    } catch(e) { alert("Login failed. Please try again."); }
  };

  // ── LOGOUT ────────────────────────────────────────────────
  window._logout = async () => {
    await signOut(auth);
  };

  // ── SAVE NOTES ────────────────────────────────────────────
  window._saveNotes = async (notes) => {
    if (!window._user) return;
    await setDoc(doc(db, "notes", window._user.uid), notes, { merge: true });
  };

  // ── LOAD IDEAS ────────────────────────────────────────────
  window._loadIdeas = async () => {
    const snap = await getDocs(collection(db, "ideas"));
    return snap.docs.map(d => ({ id: d.id, ...d.data() }));
  };

  // ── POST IDEA ────────────────────────────────────────────
  window._postIdea = async (idea) => {
    await addDoc(collection(db, "ideas"), idea);
  };

  // ── LIKE IDEA ────────────────────────────────────────────
  window._likeIdea = async (id) => {
    await updateDoc(doc(db, "ideas", id), { likes: increment(1) });
  };

  window._unlikeIdea = async (id) => {
    await updateDoc(doc(db, "ideas", id), { likes: increment(-1) });
  };

  window._appReady = true;
  if (window._render) window._render();
</script>

// ── STATE ──────────────────────────────────────────────────
let state={
  tab:"greeting",si:0,lang:"both",mnem:null,
  ideas:[],liked:JSON.parse(localStorage.getItem("liked")||"[]"),
  newStep:"HPC",newText:"",newEn:"",
  notes:JSON.parse(localStorage.getItem("notes")||"{}"),
  toast:"",copied:false,showPrint:false,
  pi:0,showAns:false,score:{c:0,t:0}
};

function speak(t){if(!window.speechSynthesis)return;window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="en-US";u.rate=0.87;window.speechSynthesis.speak(u);}
function showToast(m){state.toast=m;render();setTimeout(()=>{state.toast="";render();},2200);}

// ── RENDER ─────────────────────────────────────────────────
function render(){
  window._render=render;
  const user=window._user;
  const s=STEPS[state.si];
  const allP=STEPS.flatMap(x=>x.practice.map(p=>({...p,color:x.color,emoji:x.emoji,light:x.light,code:x.code})));
  const curP=allP[state.pi%allP.length];
  const L=state.lang;

  document.getElementById("app").innerHTML=`
  ${state.toast?`<div class="toast">${state.toast}</div>`:""}
  ${state.showPrint?printModal():""}

  <header class="header">
    <div style="max-width:900px;margin:0 auto">
      <div class="logo-row">
        <div class="logo">
          <div class="logo-icon">⚕</div>
          <div>
            <div class="logo-title">Dcode Ward History</div>
            <div class="logo-sub">ডিকোড ওয়ার্ড হিস্ট্রি · BD & International</div>
          </div>
        </div>
        <div class="header-right">
          <div class="lang-toggle">
            ${["both","en","bn"].map(v=>`<button class="lang-btn ${state.lang===v?"active":""}" onclick="state.lang='${v}';render()">${v==="both"?"EN+বাং":v.toUpperCase()}</button>`).join("")}
          </div>
          <button class="header-btn" onclick="state.showPrint=true;render()">🖨 Print</button>
          ${user
            ?`<div class="user-badge">
                ${user.photo?`<img src="${user.photo}" class="user-photo"/>`:`<span>👤</span>`}
                <span class="user-name">${user.name.split(" ")[0]}</span>
                <button class="logout-btn" onclick="window._logout()">out</button>
              </div>`
            :`<button class="google-btn" onclick="window._googleLogin()">
                <img src="https://www.google.com/favicon.ico" width="14" height="14"/> Sign in with Google
              </button>`
          }
        </div>
      </div>
      <div class="tabs">
        ${[["greeting","👋 Greeting"],["guide","📖 Guide"],["practice","🏋 Practice"],["community","💬 Community"],["notepad","📝 Notepad"]].map(([t,l])=>`<button class="tab-btn ${state.tab===t?"active":""}" onclick="state.tab='${t}';render()">${l}</button>`).join("")}
      </div>
    </div>
  </header>

  <div class="main">
    ${state.tab==="greeting"?greetingTab(L):""}
    ${state.tab==="guide"?guideTab(s,L):""}
    ${state.tab==="practice"?practiceTab(curP,allP):""}
    ${state.tab==="community"?communityTab(user):""}
    ${state.tab==="notepad"?notepadTab(user):""}
  </div>

  <footer class="footer">
    <span style="color:${C.teal};font-weight:bold">⚕ Dcode Ward History</span>
    · Created by <span style="color:${C.navy};font-weight:bold">Maria Sultana Hira</span>
    · Always verify with your clinical supervisor
  </footer>`;
}

// ── GUIDE TAB ──────────────────────────────────────────────
function guideTab(s,L){
  const pct=Math.round(((state.si+1)/STEPS.length)*100);
  return `
  <div style="margin-bottom:18px">
    <div class="progress-row"><span>STEP ${state.si+1} / ${STEPS.length}</span><span style="color:${s.color};font-weight:bold">${pct}%</span></div>
    <div class="progress-bar"><div class="progress-fill" style="width:${pct}%;background:linear-gradient(90deg,${s.color},${s.color}bb)"></div></div>
  </div>
  <div class="pills">
    ${STEPS.map((x,i)=>`<button class="pill" style="border-color:${i===state.si?x.color:C.border};background:${i===state.si?x.color:"#fff"};color:${i===state.si?"#fff":C.muted}" onclick="state.si=${i};state.mnem=null;render()">${x.code}</button>`).join("")}
  </div>
  <div class="step-card">
    <div class="step-header" style="background:linear-gradient(135deg,${s.color},${s.color}bb)">

          <div class="step-icon">${s.emoji}</div>
          <div>
            <div class="step-code">${s.code}</div>
            <div class="step-title">${s.title}</div>
            ${(L==="both"||L==="bn")?`<div class="step-title-bn">${s.title_bn}</div>`:""}
          </div>
        </div>
        <button class="pronounce-btn" onclick="speak('${s.audio}')">🔉 PRONOUNCE</button>
      </div>
      <p class="step-subtitle">${(L==="en"||L==="both")?s.subtitle:""}${L==="both"?" · ":""}${(L==="bn"||L==="both")?s.subtitle_bn:""}</p>
    </div>
    <div class="step-body">
      <div class="q-label">🎙 Key Questions</div>
      <div class="questions">
        ${s.prompts.map((q,i)=>`
        <div class="q-item" style="background:${s.light};border-left-color:${s.color}">
          <span class="q-num" style="background:${s.color}">${i+1}</span>
          <div style="flex:1">
            ${(L==="en"||L==="both")?`<div class="q-en">"${q.en}"</div>`:""}
            ${(L==="bn"||L==="both")?`<div class="q-bn" style="color:${s.color}">"${q.bn}"</div>`:""}
          </div>
          <button class="q-speak" onclick="speak('${q.en.replace(/'/g,"\\'")}')">🔊</button>

      </div>
      <div class="tip-box">
        <div class="tip-label">💡 CLINICAL TIP</div>

        ${(L==="bn"||L==="both")?`<p style="font-size:12px;color:#7A6010;line-height:1.7;margin:${L==="both"?"5px 0 0":0}">${s.tip.bn}</p>`:""}
      </div>

      </button>
      ${state.mnem===m.name?`<div class="mnem-grid">${m.items.map(it=>`<button class="mnem-item" style="background:${s.light};border-color:${s.color}44" onclick="speak('${it}')"><div style="font-family:monospace;font-size:20px;font-weight:bold;color:${s.color}">${it[0]}</div><div style="font-size:10px;color:#6B8299;margin-top:2px">${it}</div><div style="font-size:9px;color:${s.color};margin-top:3px;opacity:.7">🔊 tap</div></button>`).join("")}</div>`:""}

      <p class="scenario-box">${curP.scenario}</p>
      ${!state.showAns
        ?`<button class="reveal-btn" style="background:linear-gradient(135deg,${curP.color},${curP.color}bb)" onclick="state.showAns=true;render()">💡 Reveal Best Approach</button>`
        :`<div>
          <div style="font-family:monospace;font-size:9px;color:${C.lime};letter-spacing:3px;margin-bottom:8px">✅ SUGGESTED APPROACH</div>
          <div class="answer-box">${curP.answer}</div>
          <div style="display:flex;gap:10px">
            <button style="flex:1;padding:11px;background:#EAF6EF;border:2px solid ${C.lime};color:${C.lime};border-radius:11px;font-family:monospace;font-weight:bold;font-size:12px" onclick="state.score.c++;state.score.t++;state.showAns=false;state.pi++;render()">✅ Got it!</button>
            <button style="flex:1;padding:11px;background:#FAEAEE;border:2px solid ${C.rose};color:${C.rose};border-radius:11px;font-family:monospace;font-weight:bold;font-size:12px" onclick="state.score.t++;state.showAns=false;state.pi++;render()">❌ Need more practice</button>
          </div>
        </div>`}
    </div>
  </div>
  <div style="background:#fff;border-radius:14px;border:1px solid ${C.border};overflow:hidden">
    <div style="padding:11px 18px;border-bottom:1px solid ${C.border};font-family:monospace;font-size:10px;color:${C.muted};letter-spacing:2px;background:#F7FAFC">ALL SCENARIOS (${allP.length})</div>
    ${allP.map((p,i)=>`
    <div style="padding:11px 18px;border-bottom:1px solid ${C.border};display:flex;align-items:center;gap:10px;background:${i===state.pi%allP.length?p.light:"transparent"};cursor:pointer" onclick="state.pi=${i};state.showAns=false;render()">
      <span style="font-size:14px">${p.emoji}</span>
      <span style="font-family:monospace;font-size:10px;color:${p.color};min-width:32px;font-weight:bold">${p.code}</span>
      <span style="font-size:12px;color:${C.muted};flex:1">${p.scenario}</span>
      ${i===state.pi%allP.length?`<span style="color:${p.color};font-size:11px">▶</span>`:""}
    </div>`).join("")}
  </div>`;
}

// ── COMMUNITY TAB ──────────────────────────────────────────

  return `

  <p style="color:${C.muted};font-size:11px;margin-bottom:18px">শিক্ষার্থীদের টিপস শেয়ার করুন · Share your ward tricks</p>

  ${user?`
  <div class="post-box">
    <div style="font-family:monospace;font-size:10px;color:${C.muted};letter-spacing:2px;margin-bottom:12px;text-transform:uppercase">✍️ Post Your Idea</div>
    <select class="sel" onchange="state.newStep=this.value">
      ${STEPS.map(s=>`<option value="${s.code}" ${state.newStep===s.code?"selected":""}>${s.code} — ${s.title}</option>`).join("")}
    </select>
    <textarea class="ta" rows="2" placeholder="Write your tip..." oninput="state.newText=this.value" style="margin-bottom:8px">${state.newText}</textarea>
    <textarea class="ta" rows="2" placeholder="(Optional) Bangla translation..." oninput="state.newEn=this.value" style="margin-bottom:12px;color:${C.muted}">${state.newEn}</textarea>
    <button class="post-btn" onclick="postIdea()">POST →</button>
  </div>`:`
  <div class="login-required">
    <div style="font-size:30px;margin-bottom:8px">🔐</div>
    <div style="font-weight:bold;color:${C.navy};margin-bottom:4px">Login to post tips & like ideas</div>
    <div style="font-size:12px;color:${C.muted};margin-bottom:14px">Sign in with your Google account to join the community</div>
    <button class="google-btn" style="margin:0 auto" onclick="window._googleLogin()">
      <img src="https://www.google.com/favicon.ico" width="14" height="14"/> Sign in with Google
    </button>
  </div>`}

  <div id="ideas-list">
    ${state.ideas.length===0?`<div style="text-align:center;padding:30px;color:${C.muted};font-family:monospace;font-size:12px">Loading community tips...</div>`:""}
    ${state.ideas.map(idea=>{
      const s=STEPS.find(x=>x.code===idea.step);
      const isLiked=state.liked.includes(idea.id);
      return `<div class="idea-card" style="border-left:4px solid ${s?.color||"#999"}">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap">
          <span style="background:${s?.color};color:#fff;border-radius:5px;padding:2px 10px;font-family:monospace;font-size:10px;font-weight:bold">${idea.step}</span>
          <span style="font-family:monospace;font-size:11px;color:${C.muted}">by ${idea.author||"Anonymous"}</span>
        </div>
        <p style="margin:0 0 5px;font-size:14px;line-height:1.7">${idea.text}</p>
        ${idea.bn?`<p style="margin:0 0 10px;font-size:12px;line-height:1.6;color:${C.muted};font-style:italic">${idea.bn}</p>`:""}
        <button class="like-btn" style="background:${isLiked?"#FAEAEE":"#F4F8FC"};border-color:${isLiked?C.rose:C.border};color:${isLiked?C.rose:C.muted}" onclick="toggleLike('${idea.id}',${isLiked},${user?"true":"false"})">
          ${isLiked?"❤️":"🤍"} ${idea.likes||0}
        </button>
      </div>`;
    }).join("")}
  </div>`;
}

// ── NOTEPAD TAB ────────────────────────────────────────────
function notepadTab(user){

// ── ACTIONS ────────────────────────────────────────────────
async function toggleLike(id, isLiked, isLoggedIn){
  if(!isLoggedIn){showToast("🔐 Please login to like ideas!");return;}
  if(isLiked){
    state.liked=state.liked.filter(x=>x!==id);
    state.ideas=state.ideas.map(i=>i.id===id?{...i,likes:(i.likes||1)-1}:i);
    if(window._unlikeIdea) await window._unlikeIdea(id);
  }else{
    state.liked=[...state.liked,id];
    state.ideas=state.ideas.map(i=>i.id===id?{...i,likes:(i.likes||0)+1}:i);
    if(window._likeIdea) await window._likeIdea(id);
  }
  localStorage.setItem("liked",JSON.stringify(state.liked));
  render();
}

async function postIdea(){
  if(!window._user){showToast("🔐 Please login to post!");return;}
  if(!state.newText.trim())return;
  const idea={
    author:window._user.name,
    step:state.newStep,
    text:state.newText,
    bn:state.newEn,
    likes:0,
    createdAt:Date.now()
  };
  if(window._postIdea) await window._postIdea(idea);
  state.newText="";state.newEn="";
  await loadIdeas();
  showToast("✅ Posted!");
}

async function loadIdeas(){
  if(window._loadIdeas){
    try{
      const ideas=await window._loadIdeas();
      state.ideas=ideas.sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
    }catch(e){
      // Use default ideas if Firestore not set up
      if(state.ideas.length===0){
        state.ideas=[
          {id:"1",author:"Rafiq - DMCH",step:"HPC",text:"Ask patient to point on a body diagram — faster than verbal description.",bn:"রোগীকে শরীরের ছবিতে আঙুল দিয়ে ব্যথার জায়গা দেখাতে বলুন।",likes:18},
          {id:"2",author:"Priya - Chittagong",step:"SH",text:"Ask 'How much per week?' not 'Do you drink a lot?' — more honest answers.",bn:"'সপ্তাহে কতটা?' জিজ্ঞেস করুন।",likes:25},
          {id:"3",author:"Lin - BIRDEM",step:"PMH",text:"Start PMH with 'Apart from this, how is your general health?'",bn:"'এই সমস্যা বাদে স্বাস্থ্য কেমন?' দিয়ে শুরু করুন।",likes:12}
        ];
      }
    }
  }
  render();
}

function saveNote(id, val){
  state.notes[id]=val;
  localStorage.setItem("notes",JSON.stringify(state.notes));
  if(window._saveNotes) window._saveNotes(state.notes);
}

function copyNotes(){
  const txt=STEPS.map(s=>"## "+s.title+"\n"+(state.notes[s.id]||"(empty)")).join("\n\n");
  navigator.clipboard.writeText(txt).catch(()=>{});
  state.copied=true;render();
  showToast("📋 Notes copied!");
  setTimeout(()=>{state.copied=false;render();},2200);
}

// ── INIT ───────────────────────────────────────────────────
window._render=render;
// Load saved notes from localStorage first
const savedNotes=localStorage.getItem("notes");
if(savedNotes) state.notes=JSON.parse(savedNotes);
render();
loadIdeas();

if('serviceWorker' in navigator){
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
</script>
