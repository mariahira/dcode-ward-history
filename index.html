<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"/>
<meta name="theme-color" content="#1A3557"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Dcode Ward"/>
<link rel="manifest" href="manifest.json"/>
<link rel="apple-touch-icon" href="icon-180.png"/>
<title>Dcode Ward History</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:Georgia,serif;background:#F0F4F8;color:#1E2D3D;}
button{cursor:pointer;}
button:active{transform:scale(0.97);}
textarea,input,select{font-family:Georgia,serif;outline:none;}
textarea:focus,input:focus,select:focus{outline:2px solid #2E8B8B;}
::-webkit-scrollbar{width:5px;}
::-webkit-scrollbar-thumb{background:#DCE8F0;border-radius:10px;}

/* Header */
.header{background:linear-gradient(135deg,#1A3557,#1E4976);padding:14px 16px 10px;position:sticky;top:0;z-index:100;box-shadow:0 4px 20px rgba(26,53,87,.3);}
.logo-row{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;}
.logo{display:flex;align-items:center;gap:10px;}
.logo-icon{background:rgba(255,255,255,.15);border:2px solid rgba(255,255,255,.25);border-radius:12px;padding:7px 11px;font-size:22px;}
.logo-title{font-size:17px;font-weight:bold;font-family:monospace;color:#fff;}
.logo-sub{font-size:9px;color:rgba(255,255,255,.6);font-family:monospace;}
.header-right{display:flex;gap:6px;align-items:center;flex-wrap:wrap;}
.lang-toggle{display:flex;background:rgba(255,255,255,.1);border-radius:20px;padding:3px;gap:2px;}
.lang-btn{padding:3px 10px;border-radius:16px;border:none;font-size:10px;font-weight:bold;cursor:pointer;transition:all .2s;}
.lang-btn.active{background:#fff;color:#1A3557;}
.lang-btn:not(.active){background:transparent;color:rgba(255,255,255,.75);}
.header-btn{padding:5px 12px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:20px;font-size:11px;font-family:monospace;}
.login-btn{padding:5px 14px;background:rgba(255,255,255,.95);border:none;color:#1A3557;border-radius:20px;font-size:11px;font-family:monospace;font-weight:bold;}
.user-badge{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:20px;padding:4px 12px;}
.user-badge span{font-size:11px;color:#fff;font-family:monospace;}
.logout-btn{background:none;border:none;color:rgba(255,255,255,.5);font-size:10px;font-family:monospace;}

/* Tabs */
.tabs{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;}
.tab-btn{padding:5px 14px;border-radius:20px;border:none;font-size:11px;font-family:monospace;transition:all .2s;}
.tab-btn.active{background:#fff;color:#1A3557;font-weight:bold;}
.tab-btn:not(.active){background:rgba(255,255,255,.12);color:rgba(255,255,255,.8);}

/* Main */
.main{max-width:900px;margin:0 auto;padding:20px 14px 50px;}

/* Toast */
.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:#1A3557;color:#fff;border:1px solid #2E8B8B;padding:9px 22px;border-radius:28px;z-index:3000;font-family:monospace;font-size:12px;box-shadow:0 5px 20px rgba(0,0,0,.15);white-space:nowrap;}

/* Progress */
.progress-row{display:flex;justify-content:space-between;font-size:10px;font-family:monospace;color:#6B8299;margin-bottom:5px;}
.progress-bar{height:6px;background:#DCE8F0;border-radius:10px;overflow:hidden;}
.progress-fill{height:100%;border-radius:10px;transition:width .4s;}

/* Pills */
.pills{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0;}
.pill{padding:5px 14px;border-radius:20px;border:2px solid;font-size:11px;font-weight:bold;font-family:monospace;transition:all .2s;}

/* Step card */
.step-card{background:#fff;border-radius:18px;box-shadow:0 6px 24px rgba(26,53,87,.1);overflow:hidden;margin-bottom:16px;border:1px solid #DCE8F0;}
.step-header{padding:20px 22px;}
.step-header-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;flex-wrap:wrap;}
.step-icon-box{display:flex;align-items:center;gap:12px;}
.step-icon{background:rgba(255,255,255,.2);border:2px solid rgba(255,255,255,.3);border-radius:14px;padding:8px 12px;font-size:26px;}
.step-code{font-size:9px;font-family:monospace;color:rgba(255,255,255,.8);letter-spacing:3px;margin-bottom:2px;}
.step-title{font-size:18px;font-weight:bold;color:#fff;}
.step-title-bn{font-size:12px;color:rgba(255,255,255,.85);margin-top:2px;}
.step-subtitle{margin:10px 0 0;font-size:13px;line-height:1.7;color:rgba(255,255,255,.9);}
.pronounce-btn{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.2);border:1.5px solid rgba(255,255,255,.4);color:#fff;border-radius:10px;padding:7px 12px;flex-shrink:0;font-size:11px;font-family:monospace;}
.step-body{padding:20px;}

/* Questions */
.q-label{font-family:monospace;font-size:9px;color:#6B8299;letter-spacing:3px;margin-bottom:10px;text-transform:uppercase;}
.questions{display:flex;flex-direction:column;gap:9px;}
.q-item{display:flex;gap:10px;padding:11px 14px;border-radius:11px;border-left:4px solid;align-items:flex-start;}
.q-num{border-radius:50%;width:20px;height:20px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:bold;flex-shrink:0;margin-top:2px;color:#fff;}
.q-en{font-size:13px;font-style:italic;line-height:1.5;}
.q-bn{font-size:12px;line-height:1.5;margin-top:2px;}
.q-speak{background:none;border:none;font-size:14px;opacity:.5;flex-shrink:0;}

/* Tip */
.tip-box{background:#FFFBF0;border:1px solid #F5D87A;border-radius:11px;padding:12px 16px;margin-top:16px;}
.tip-label{font-family:monospace;font-size:9px;color:#B7841A;letter-spacing:3px;margin-bottom:5px;}
.tip-en{font-size:13px;color:#5C4A00;line-height:1.7;margin:0;}
.tip-bn{font-size:12px;color:#7A6010;line-height:1.7;margin:5px 0 0;}

/* Mnemonic */
.mnem-btn{display:flex;align-items:center;gap:8px;border:2px solid;border-radius:11px;padding:10px 16px;width:100%;text-align:left;margin-top:16px;font-family:monospace;font-weight:bold;font-size:12px;}
.mnem-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px;margin-top:10px;}
.mnem-item{border:1.5px solid;border-radius:11px;padding:10px 8px;text-align:center;}
.mnem-letter{font-family:monospace;font-size:20px;font-weight:bold;}
.mnem-word{font-size:10px;color:#6B8299;margin-top:2px;}
.mnem-tap{font-size:9px;margin-top:3px;opacity:.7;}

/* Nav */
.nav-row{display:flex;gap:10px;justify-content:space-between;margin-top:16px;}
.nav-back{padding:10px 20px;border-radius:11px;border:2px solid #DCE8F0;background:#fff;font-family:monospace;font-weight:bold;font-size:12px;}
.nav-next{padding:10px 24px;border-radius:11px;border:none;color:#fff;font-family:monospace;font-weight:bold;font-size:12px;}

/* Flow map */
.flow-map{background:#fff;border-radius:14px;padding:16px 18px;box-shadow:0 3px 14px rgba(26,53,87,.07);border:1px solid #DCE8F0;margin-top:20px;}
.flow-label{font-family:monospace;font-size:9px;color:#6B8299;letter-spacing:3px;margin-bottom:12px;text-transform:uppercase;}
.flow-row{display:flex;align-items:center;flex-wrap:wrap;gap:5px;}
.flow-item{display:flex;flex-direction:column;align-items:center;gap:3px;border:2px solid;border-radius:11px;padding:8px 10px;min-width:52px;transition:all .2s;}
.flow-emoji{font-size:16px;}
.flow-code{font-family:monospace;font-size:9px;font-weight:bold;}
.flow-line{width:12px;height:2px;background:#DCE8F0;flex-shrink:0;}

/* Practice */
.score-box{background:#fff;border:2px solid #4CAF7D;border-radius:12px;padding:7px 18px;text-align:center;}
.score-label{font-family:monospace;font-size:10px;color:#6B8299;}
.score-val{font-family:monospace;font-size:20px;font-weight:bold;color:#4CAF7D;}
.scenario-box{font-size:15px;line-height:1.7;background:#F7FAFC;border-radius:11px;padding:14px 18px;border:1px solid #DCE8F0;margin:0 0 18px;}
.reveal-btn{width:100%;padding:13px;border:none;border-radius:11px;color:#fff;font-weight:bold;font-size:13px;font-family:monospace;}
.answer-box{background:#EAF6EF;border:1.5px solid #4CAF7D;border-radius:11px;padding:14px 18px;font-size:14px;line-height:1.7;color:#2D6A4F;margin-bottom:16px;}
.got-it{flex:1;padding:11px;background:#EAF6EF;border:2px solid #4CAF7D;color:#4CAF7D;border-radius:11px;font-family:monospace;font-weight:bold;font-size:12px;}
.need-more{flex:1;padding:11px;background:#FAEAEE;border:2px solid #D95F7A;color:#D95F7A;border-radius:11px;font-family:monospace;font-weight:bold;font-size:12px;}
.scenarios-list{background:#fff;border-radius:14px;border:1px solid #DCE8F0;overflow:hidden;}
.scenarios-header{padding:11px 18px;border-bottom:1px solid #DCE8F0;font-family:monospace;font-size:10px;color:#6B8299;letter-spacing:2px;background:#F7FAFC;}
.scenario-row{padding:11px 18px;border-bottom:1px solid #DCE8F0;display:flex;align-items:center;gap:10px;transition:background .2s;}

/* Community */
.post-box{background:#fff;border-radius:14px;border:1px solid #DCE8F0;padding:20px;margin-bottom:18px;}
.idea-card{background:#fff;border-radius:12px;padding:18px;border:1px solid #DCE8F0;margin-bottom:10px;}
.idea-tag{color:#fff;border-radius:5px;padding:2px 10px;font-family:monospace;font-size:10px;font-weight:bold;}
.like-btn{display:flex;align-items:center;gap:5px;border-radius:18px;padding:4px 12px;font-size:12px;font-family:monospace;border:1px solid;}

/* Notepad */
.note-card{background:#fff;border-radius:12px;overflow:hidden;border:1px solid #DCE8F0;margin-bottom:12px;}
.note-header{padding:9px 16px;display:flex;align-items:center;gap:7px;}
.save-banner{background:#FFFBF0;border:1px solid #F5D87A;border-radius:11px;padding:11px 16px;margin-bottom:18px;display:flex;align-items:center;gap:10px;}

/* Login */
.login-card{background:#fff;border:1px solid #DCE8F0;border-radius:18px;padding:30px;width:100%;max-width:400px;box-shadow:0 8px 36px rgba(26,53,87,.12);}
.login-center{display:flex;align-items:center;justify-content:center;min-height:55vh;}
.err-box{background:#FEE8ED;border:1px solid #F8B4C2;color:#D95F7A;border-radius:7px;padding:7px 12px;font-size:11px;margin-bottom:12px;text-align:center;}
.login-submit{width:100%;padding:12px;background:linear-gradient(135deg,#1A3557,#1E4976);border:none;border-radius:11px;color:#fff;font-weight:bold;font-size:14px;font-family:monospace;box-shadow:0 4px 16px rgba(26,53,87,.25);}

/* Print modal */
.print-modal{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:1000;display:flex;align-items:center;justify-content:center;padding:14px;}
.print-inner{background:#fff;border-radius:16px;max-width:700px;width:100%;max-height:90vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.25);}
.print-header{display:flex;justify-content:space-between;align-items:center;padding:12px 20px;background:#1A3557;border-radius:16px 16px 0 0;}
.print-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px;}
.print-step{border:2px solid;border-radius:9px;overflow:hidden;}
.print-step-header{padding:7px 11px;display:flex;gap:7px;align-items:center;}
.print-step-body{padding:9px 11px;background:#fafafa;}

/* Footer */
.footer{text-align:center;padding:14px;font-family:monospace;font-size:10px;color:#6B8299;border-top:1px solid #DCE8F0;background:#fff;}

/* Input */
.inp{width:100%;padding:10px 13px;background:#F0F4F8;border:1.5px solid #DCE8F0;border-radius:9px;color:#1E2D3D;font-size:13px;font-family:Georgia,serif;margin-bottom:11px;box-sizing:border-box;}
.sel{width:100%;padding:9px 12px;background:#F0F4F8;border:1.5px solid #DCE8F0;border-radius:9px;color:#1E2D3D;font-size:12px;font-family:monospace;margin-bottom:10px;box-sizing:border-box;}
.ta{width:100%;background:#F0F4F8;border:1.5px solid #DCE8F0;border-radius:9px;color:#1E2D3D;font-size:13px;font-family:Georgia,serif;resize:vertical;box-sizing:border-box;padding:10px 12px;}
.post-btn{padding:9px 22px;background:linear-gradient(135deg,#1A3557,#1E4976);color:#fff;border:none;border-radius:9px;font-family:monospace;font-weight:bold;font-size:12px;}
.copy-btn{padding:8px 18px;color:#fff;border:none;border-radius:9px;font-family:monospace;font-size:11px;font-weight:bold;transition:background .3s;}

@media print{header,.tabs,.nav-row,.footer,button{display:none!important;}}
</style>
</head>
<body>
<div id="app"></div>
<script>
// ── DATA ──────────────────────────────────────────────────────
const C={navy:"#1A3557",teal:"#2E8B8B",cyan:"#3AAFCF",lime:"#4CAF7D",amber:"#F5A623",rose:"#D95F7A",purple:"#7B6FCC",orange:"#E07B4A",muted:"#6B8299",border:"#DCE8F0",lightBg:"#F7FAFC"};

const STEPS=[
  {id:"pc",code:"PC",emoji:"🩺",color:C.teal,light:"#E8F6F6",title:"Presenting Complaint",title_bn:"প্রধান অভিযোগ",subtitle:"Chief reason — in the patient's own words",subtitle_bn:"রোগীর নিজের ভাষায় আসার কারণ",audio:"Presenting Complaint",
   prompts:[{en:"What brings you in today?",bn:"আজ কী সমস্যা নিয়ে এসেছেন?"},{en:"What is the main problem you are experiencing?",bn:"আপনার প্রধান সমস্যাটি কী?"},{en:"How long have you had this problem?",bn:"কতদিন ধরে এই সমস্যা?"}],
   tip:{en:"Use open-ended questions. Let the patient speak first.",bn:"উন্মুক্ত প্রশ্ন করুন। রোগীকে প্রথমে কথা বলতে দিন।"},mnemonics:[],
   practice:[{scenario:"A 45-year-old man walks in holding his chest.",answer:"Start with 'What brings you in today?' — let him describe in his own words first."},{scenario:"An elderly woman says 'I don't feel well.'",answer:"Ask 'Can you tell me more about what you're feeling?' — avoid yes/no questions."}]},
  {id:"hpc",code:"HPC",emoji:"🔬",color:C.cyan,light:"#EAF6FB",title:"History of Presenting Complaint",title_bn:"বর্তমান অভিযোগের ইতিহাস",subtitle:"Deep-dive using SOCRATES framework",subtitle_bn:"SOCRATES পদ্ধতিতে বিশ্লেষণ",audio:"History of Presenting Complaint",
   prompts:[{en:"When exactly did it start?",bn:"এটা ঠিক কখন শুরু হয়েছিল?"},{en:"Did it come on suddenly or gradually?",bn:"হঠাৎ নাকি আস্তে আস্তে?"},{en:"What makes it better or worse?",bn:"কিসে ভালো বা খারাপ হয়?"},{en:"Rate severity 1-10.",bn:"১ থেকে ১০ এ কতটুকু?"}],
   tip:{en:"Always ask about associated symptoms — never stop at the chief complaint.",bn:"সংশ্লিষ্ট উপসর্গ সম্পর্কে সবসময় জিজ্ঞেস করুন।"},
   mnemonics:[{name:"SOCRATES",items:["Site","Onset","Character","Radiation","Associations","Time course","Exacerbating/Relieving","Severity"]}],
   practice:[{scenario:"Patient says: 'I have chest pain.'",answer:"Use SOCRATES — Site? Onset? Character? Radiation to arm/jaw? What makes it worse?"},{scenario:"Patient says: 'I have a headache.'",answer:"How long? Where? Throbbing? Light sensitivity? Nausea? Neck stiffness?"}]},
  {id:"pmh",code:"PMH",emoji:"📋",color:C.lime,light:"#EAF6EF",title:"Past Medical History",title_bn:"পূর্ববর্তী চিকিৎসা ইতিহাস",subtitle:"Previous illnesses, surgeries, hospitalizations",subtitle_bn:"আগের রোগ, অপারেশন ও হাসপাতাল ভর্তি",audio:"Past Medical History",
   prompts:[{en:"Any known medical conditions?",bn:"পরিচিত কোনো রোগ আছে?"},{en:"Ever been admitted to hospital?",bn:"কখনো হাসপাতালে ভর্তি হয়েছেন?"},{en:"Any previous operations?",bn:"কোনো অপারেশন হয়েছে?"}],
   tip:{en:"Ask specifically about DM, HTN, TB, Asthma — patients forget chronic conditions.",bn:"ডায়াবেটিস, উচ্চ রক্তচাপ, যক্ষ্মা সরাসরি জিজ্ঞেস করুন।"},
   mnemonics:[{name:"MJ THREADS",items:["MI","Jaundice","TB","HTN","Rheumatic fever","Epilepsy","Asthma","Diabetes","Stroke"]}],
   practice:[{scenario:"Patient denies any past illnesses.",answer:"Probe: 'Any blood pressure? Diabetes? TB or jaundice?' Direct questions unlock forgotten history."}]},
  {id:"dh",code:"DH",emoji:"💊",color:C.purple,light:"#F0EEF9",title:"Drug History & Allergies",title_bn:"ওষুধের ইতিহাস ও অ্যালার্জি",subtitle:"Medications, OTC drugs, supplements & allergies",subtitle_bn:"ওষুধ, ভিটামিন, সাপ্লিমেন্ট এবং অ্যালার্জি",audio:"Drug History and Allergies",
   prompts:[{en:"Any current medications including OTC?",bn:"বর্তমানে কোনো ওষুধ খাচ্ছেন?"},{en:"Any herbal or traditional remedies?",bn:"ভেষজ বা দেশীয় ওষুধ খাচ্ছেন?"},{en:"Any known allergies? What happens?",bn:"অ্যালার্জি আছে? কী হয় তখন?"}],
   tip:{en:"Distinguish true allergy from side effect. Note dose and compliance.",bn:"অ্যালার্জি ও পার্শ্বপ্রতিক্রিয়ার পার্থক্য করুন।"},mnemonics:[],
   practice:[{scenario:"Patient says 'I'm allergic to penicillin.'",answer:"Ask 'What exactly happens?' Distinguish rash/anaphylaxis (true allergy) from GI upset (intolerance)."}]},
  {id:"fh",code:"FH",emoji:"👪",color:C.amber,light:"#FEF6E4",title:"Family History",title_bn:"পারিবারিক ইতিহাস",subtitle:"Hereditary conditions in close relatives",subtitle_bn:"নিকটাত্মীয়দের বংশগত রোগের ইতিহাস",audio:"Family History",
   prompts:[{en:"Any conditions run in your family?",bn:"পরিবারে কোনো রোগ আছে?"},{en:"Are your parents alive? Cause of death?",bn:"বাবা-মা বেঁচে আছেন? মৃত্যুর কারণ?"},{en:"Family history of DM, heart disease, cancer?",bn:"পরিবারে ডায়াবেটিস, হৃদরোগ, ক্যান্সার?"}],
   tip:{en:"Focus on first-degree relatives: parents, siblings, children.",bn:"প্রথম-স্তরের আত্মীয়: বাবা-মা, ভাই-বোন, সন্তান।"},mnemonics:[],
   practice:[{scenario:"Young patient with chest pain, father died at 50.",answer:"Explore family cardiac history — premature CAD is hereditary. Ask about cholesterol, sudden deaths."}]},
  {id:"sh",code:"SH",emoji:"🏙",color:C.orange,light:"#FDF0E8",title:"Social History",title_bn:"সামাজিক ইতিহাস",subtitle:"Occupation, lifestyle, habits & support system",subtitle_bn:"পেশা, জীবনযাত্রা, অভ্যাস ও সামাজিক সহায়তা",audio:"Social History",
   prompts:[{en:"What is your occupation?",bn:"আপনার পেশা কী?"},{en:"Do you smoke or use tobacco?",bn:"ধূমপান বা তামাক সেবন করেন?"},{en:"Do you drink alcohol? How much per week?",bn:"মদ্যপান করেন? সপ্তাহে কতটুকু?"},{en:"Who lives with you at home?",bn:"বাড়িতে কারা থাকেন?"}],
   tip:{en:"Be non-judgmental. Ask 'How much per week?' not 'Do you drink a lot?'",bn:"বিচার না করে জিজ্ঞেস করুন। 'কতটুকু?' জিজ্ঞেস করুন।"},
   mnemonics:[{name:"SADMA",items:["Smoking","Alcohol","Drugs","Marital status","Activity/Occupation"]}],
   practice:[{scenario:"Patient seems reluctant to discuss habits.",answer:"Normalize: 'I ask everyone this so I can give the best care.' Non-judgmental tone opens doors."}]},

let state={

function speak(t){if(!window.speechSynthesis)return;window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="en-US";u.rate=0.87;window.speechSynthesis.speak(u);}

function setState(patch){Object.assign(state,patch);render();}

function showToast(m){setState({toast:m});setTimeout(()=>setState({toast:""}),2200);}

function render(){
  const s=STEPS[state.si];
  const allP=STEPS.flatMap(x=>x.practice.map(p=>({...p,color:x.color,emoji:x.emoji,light:x.light,code:x.code})));
  const curP=allP[state.pi%allP.length];
  const L=state.lang;

  document.getElementById("app").innerHTML=`
  ${state.toast?`<div class="toast">${state.toast}</div>`:""}

  ${state.showPrint?printModal():""}

  <header class="header">
    <div style="max-width:900px;margin:0 auto">
      <div class="logo-row">
        <div class="logo">
          <div class="logo-icon">⚕</div>
          <div>
            <div class="logo-title">Dcode Ward History</div>
            <div class="logo-sub">ডিকোড ওয়ার্ড হিস্ট্রি · BD & International</div>
          </div>
        </div>
        <div class="header-right">
          <div class="lang-toggle">
            ${["both","en","bn"].map(v=>`<button class="lang-btn ${state.lang===v?"active":""}" onclick="setState({lang:'${v}'})">${v==="both"?"EN+বাং":v.toUpperCase()}</button>`).join("")}

          ${state.loggedIn
            ?`<div class="user-badge"><span>👤</span><span>${state.user.name}</span><button class="logout-btn" onclick="setState({loggedIn:false,user:null})">out</button></div>`
            :`<button class="login-btn" onclick="setState({tab:'login'})">🔐 Login</button>`}
        </div>
      </div>
      <div class="tabs">
        ${[["guide","📖 Guide"],["practice","🏋 Practice"],["community","💬 Community"],["notepad","📝 Notepad"]].map(([t,l])=>`<button class="tab-btn ${state.tab===t?"active":""}" onclick="setState({tab:'${t}'})">${l}</button>`).join("")}
      </div>
    </div>
  </header>

  <div class="main">
    ${state.tab==="guide"?guideTab(s,L,allP):""}
    ${state.tab==="practice"?practiceTab(curP,allP):""}

}

            <div style="margin-top:5px;font-size:8px;color:#555;font-style:italic;border-top:1px dashed #e0e0e0;padding-top:4px">💡 ${s.tip.en}</div>
          </div>
        </div>`).join("")}
      </div>
      <div style="margin-top:12px;text-align:center;font-size:8px;color:#aaa;border-top:1px solid #eee;padding-top:8px">Dcode Ward History · Created by Maria Sultana Hira · Always verify with your clinical supervisor</div>
    </div>
    <div style="padding:11px 20px;border-top:1px solid #eee;display:flex;justify-content:flex-end;background:#f9f9f9;border-radius:0 0 16px 16px">
      <button style="padding:9px 24px;background:${C.teal};color:#fff;border:none;border-radius:9px;font-weight:bold;font-size:13px" onclick="window.print()">🖨 Print / Save PDF</button>
    </div>
  </div></div>`;
}

// ── ACTIONS ───────────────────────────────────────────────────
function toggleLike(id){
  if(state.liked.includes(id)){
    state.liked=state.liked.filter(x=>x!==id);
    state.ideas=state.ideas.map(i=>i.id===id?{...i,likes:i.likes-1}:i);
  }else{
    state.liked=[...state.liked,id];
    state.ideas=state.ideas.map(i=>i.id===id?{...i,likes:i.likes+1}:i);
  }
  render();
}

function postIdea(){
  if(!state.newText.trim())return;
  state.ideas=[{id:Date.now(),author:state.loggedIn?state.user.name+" (You)":"You",step:state.newStep,text:state.newText,bn:state.newEn,likes:0},...state.ideas];
  state.newText="";state.newEn="";
  showToast("✅ Posted!");
}

function copyNotes(){
  const txt=STEPS.map(s=>"## "+s.title+"\n"+(state.notes[s.id]||"(empty)")).join("\n\n");
  navigator.clipboard.writeText(txt).catch(()=>{});
  state.copied=true;render();
  showToast("📋 Notes copied!");
  setTimeout(()=>{state.copied=false;render();},2200);
}

function doLogin(){
  if(!state.femail||!state.fpass){state.ferr="Please fill all fields.";render();return;}
  const n=state.fname||state.femail.split("@")[0];
  state.user={name:n,email:state.femail};
  state.loggedIn=true;state.ferr="";state.tab="guide";
  showToast("👋 Welcome, "+n+"!");
}

// ── INIT ──────────────────────────────────────────────────────
render();

if('serviceWorker' in navigator){
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
</script>
</body>
</html>
