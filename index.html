<script>
const C={bg:"#F0F4F8",surface:"#FFFFFF",card:"#FFFFFF",border:"#DCE8F0",navy:"#1A3557",teal:"#2E8B8B",cyan:"#3AAFCF",lime:"#4CAF7D",amber:"#F5A623",rose:"#D95F7A",purple:"#7B6FCC",orange:"#E07B4A",text:"#1E2D3D",muted:"#6B8299",lightBg:"#F7FAFC"};

const STEPS=[
  {id:"pc",code:"PC",emoji:"🩺",color:C.teal,light:"#E8F6F6",title:"Presenting Complaint",title_bn:"প্রধান অভিযোগ",subtitle:"Chief reason — in the patient's own words",subtitle_bn:"রোগীর নিজের ভাষায় আসার কারণ",audio:"Presenting Complaint",
   prompts:[{en:"What brings you in today?",bn:"আজ কী সমস্যা নিয়ে এসেছেন?"},{en:"What is the main problem you are experiencing?",bn:"আপনার প্রধান সমস্যাটি কী?"},{en:"How long have you had this problem?",bn:"কতদিন ধরে এই সমস্যা?"}],
   tip:{en:"Use open-ended questions. Let the patient speak first without interrupting.",bn:"উন্মুক্ত প্রশ্ন করুন। রোগীকে প্রথমে কথা বলতে দিন।"},mnemonics:[],
   practice:[{scenario:"A 45-year-old man walks in holding his chest.",answer:"Start with: 'What brings you in today?' — let him describe in his own words before asking specifics."},{scenario:"An elderly woman says 'I don't feel well.'",answer:"Ask: 'Can you tell me more about what you're feeling?' — avoid yes/no questions at this stage."}]},
  {id:"hpc",code:"HPC",emoji:"🔬",color:C.cyan,light:"#EAF6FB",title:"History of Presenting Complaint",title_bn:"বর্তমান অভিযোগের ইতিহাস",subtitle:"Deep-dive using SOCRATES framework",subtitle_bn:"SOCRATES পদ্ধতিতে বিশ্লেষণ",audio:"History of Presenting Complaint",
   prompts:[{en:"When exactly did it start?",bn:"এটা ঠিক কখন শুরু হয়েছিল?"},{en:"Did it come on suddenly or gradually?",bn:"হঠাৎ নাকি আস্তে আস্তে?"},{en:"What makes it better or worse?",bn:"কিসে ভালো বা খারাপ হয়?"},{en:"Rate severity 1-10.",bn:"১ থেকে ১০ এ কতটুকু?"}],
   tip:{en:"Always ask about associated symptoms — never stop at the chief complaint.",bn:"সংশ্লিষ্ট উপসর্গ সম্পর্কে সবসময় জিজ্ঞেস করুন।"},
   mnemonics:[{name:"SOCRATES",items:["Site","Onset","Character","Radiation","Associations","Time course","Exacerbating/Relieving","Severity"]}],
   practice:[{scenario:"Patient says: 'I have chest pain.'",answer:"Use SOCRATES — Site? Onset? Character? Radiation to arm/jaw? Associated symptoms? What makes it worse?"},{scenario:"Patient says: 'I have a headache.'",answer:"Ask: How long? Where exactly? Throbbing? Does light bother you? Any nausea? Neck stiffness?"}]},
  {id:"pmh",code:"PMH",emoji:"📋",color:C.lime,light:"#EAF6EF",title:"Past Medical History",title_bn:"পূর্ববর্তী চিকিৎসা ইতিহাস",subtitle:"Previous illnesses, surgeries, hospitalizations",subtitle_bn:"আগের রোগ, অপারেশন ও হাসপাতাল ভর্তি",audio:"Past Medical History",
   prompts:[{en:"Any known medical conditions?",bn:"পরিচিত কোনো রোগ আছে?"},{en:"Ever been admitted to hospital?",bn:"কখনো হাসপাতালে ভর্তি হয়েছেন?"},{en:"Any previous operations?",bn:"কোনো অপারেশন হয়েছে?"}],
   tip:{en:"Ask specifically about DM, HTN, TB, Asthma — patients often forget chronic conditions.",bn:"ডায়াবেটিস, উচ্চ রক্তচাপ, যক্ষ্মা সরাসরি জিজ্ঞেস করুন।"},
   mnemonics:[{name:"MJ THREADS",items:["MI","Jaundice","TB","HTN","Rheumatic fever","Epilepsy","Asthma","Diabetes","Stroke"]}],
   practice:[{scenario:"Patient denies any past illnesses.",answer:"Probe specifically: 'Any blood pressure issues? Diabetes? TB or jaundice?' Direct questions unlock forgotten history."}]},
  {id:"dh",code:"DH",emoji:"💊",color:C.purple,light:"#F0EEF9",title:"Drug History & Allergies",title_bn:"ওষুধের ইতিহাস ও অ্যালার্জি",subtitle:"Medications, OTC drugs, supplements & allergies",subtitle_bn:"ওষুধ, ভিটামিন, সাপ্লিমেন্ট এবং অ্যালার্জি",audio:"Drug History and Allergies",
   prompts:[{en:"Any current medications including OTC?",bn:"বর্তমানে কোনো ওষুধ খাচ্ছেন?"},{en:"Any herbal or traditional remedies?",bn:"ভেষজ বা দেশীয় ওষুধ খাচ্ছেন?"},{en:"Any known allergies? What happens?",bn:"অ্যালার্জি আছে? কী হয় তখন?"}],
   tip:{en:"Distinguish true allergy from side effect. Note dose, frequency, and compliance.",bn:"অ্যালার্জি ও পার্শ্বপ্রতিক্রিয়ার পার্থক্য করুন।"},mnemonics:[],
   practice:[{scenario:"Patient says 'I'm allergic to penicillin.'",answer:"Ask: 'What exactly happens when you take it?' Distinguish rash/anaphylaxis (true allergy) from GI upset (intolerance)."}]},
  {id:"fh",code:"FH",emoji:"👨‍👩‍👧",color:C.amber,light:"#FEF6E4",title:"Family History",title_bn:"পারিবারিক ইতিহাস",subtitle:"Hereditary conditions in close relatives",subtitle_bn:"নিকটাত্মীয়দের বংশগত রোগের ইতিহাস",audio:"Family History",
   prompts:[{en:"Any conditions run in your family?",bn:"পরিবারে কোনো রোগ আছে?"},{en:"Are your parents alive? Cause of death?",bn:"বাবা-মা বেঁচে আছেন? মৃত্যুর কারণ?"},{en:"Family history of DM, heart disease, cancer?",bn:"পরিবারে ডায়াবেটিস, হৃদরোগ, ক্যান্সার?"}],
   tip:{en:"Focus on first-degree relatives: parents, siblings, children.",bn:"প্রথম-স্তরের আত্মীয়: বাবা-মা, ভাই-বোন, সন্তান।"},mnemonics:[],
   practice:[{scenario:"Young patient with chest pain, father died at 50.",answer:"Explore family cardiac history — premature CAD is hereditary. Ask about cholesterol, sudden deaths in family."}]},
  {id:"sh",code:"SH",emoji:"🏙️",color:C.orange,light:"#FDF0E8",title:"Social History",title_bn:"সামাজিক ইতিহাস",subtitle:"Occupation, lifestyle, habits & support system",subtitle_bn:"পেশা, জীবনযাত্রা, অভ্যাস ও সামাজিক সহায়তা",audio:"Social History",
   prompts:[{en:"What is your occupation?",bn:"আপনার পেশা কী?"},{en:"Do you smoke or use tobacco?",bn:"ধূমপান বা তামাক সেবন করেন?"},{en:"Do you drink alcohol? How much per week?",bn:"মদ্যপান করেন? সপ্তাহে কতটুকু?"},{en:"Who lives with you at home?",bn:"বাড়িতে কারা থাকেন?"}],
   tip:{en:"Be non-judgmental. Ask 'How much per week?' not 'Do you drink a lot?'",bn:"বিচার না করে জিজ্ঞেস করুন। 'কতটুকু?' জিজ্ঞেস করুন।"},
   mnemonics:[{name:"SADMA",items:["Smoking","Alcohol","Drugs","Marital status","Activity/Occupation"]}],
   practice:[{scenario:"Patient seems reluctant to discuss habits.",answer:"Normalize it: 'Many of my patients smoke or drink — I ask everyone so I can give the best care.' Non-judgmental tone opens doors."}]},
  {id:"ros",code:"ROS",emoji:"⚕️",color:C.rose,light:"#FAEAEE",title:"Review of Systems",title_bn:"সিস্টেম রিভিউ",subtitle:"Systematic screening of all body systems",subtitle_bn:"সমস্ত অঙ্গতন্ত্রের পদ্ধতিগত পর্যালোচনা",audio:"Review of Systems",
   prompts:[{en:"Any headaches, dizziness, or vision changes?",bn:"মাথাব্যথা, মাথা ঘোরা বা দৃষ্টি পরিবর্তন?"},{en:"Any chest pain or shortness of breath?",bn:"বুকে ব্যথা বা শ্বাসকষ্ট?"},{en:"Any nausea, vomiting, or bowel changes?",bn:"বমি ভাব, বমি বা পেটের সমস্যা?"},{en:"Any urinary symptoms?",bn:"প্রস্রাবের কোনো সমস্যা?"}],
   tip:{en:"Screen by system — only drill deeper if positive. Don't ask everything at once.",bn:"প্রতিটি সিস্টেম স্ক্রিন করুন — পজিটিভ হলেই বিস্তারিত জিজ্ঞেস করুন।"},mnemonics:[],
   practice:[{scenario:"You've completed HPC for abdominal pain.",answer:"Now screen other systems: chest pain? urinary symptoms? fever/rigors? Systematic screening catches what focused history misses."}]}
];

const INIT_IDEAS=[
  {id:1,author:"Rafiq · DMCH",step:"HPC",text:"রোগীকে শরীরের ছবিতে আঙুল দিয়ে ব্যথার জায়গা দেখাতে বলুন।",en:"Ask patient to point on a body diagram — faster than verbal description.",likes:18},
  {id:2,author:"Priya · Chittagong",step:"SH",text:"'সপ্তাহে কতটা?' জিজ্ঞেস করুন — সরাসরি 'বেশি খান?' নয়।",en:"Ask 'How much per week?' not 'Do you drink a lot?' — more honest answers.",likes:25},
  {id:3,author:"Lin · BIRDEM",step:"PMH",text:"'এই সমস্যা বাদে স্বাস্থ্য কেমন?' দিয়ে PMH শুরু করলে রোগী বেশি খোলে।",en:"Start PMH with 'Apart from this, how is your general health?' — opens up patients.",likes:12}
];

function speak(text){if(!window.speechSynthesis)return;window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang="en-US";u.rate=0.87;window.speechSynthesis.speak(u);}

const {useState,createElement:h}=React;

function App(){
  const [tab,setTab]=useState("guide");
  const [si,setSi]=useState(0);
  const [lang,setLang]=useState("both");
  const [mnem,setMnem]=useState(null);
  const [ideas,setIdeas]=useState(INIT_IDEAS);
  const [liked,setLiked]=useState([]);
  const [newIdea,setNewIdea]=useState({step:"HPC",text:"",en:""});
  const [notes,setNotes]=useState({});
  const [spk,setSpk]=useState(false);
  const [toast,setToast]=useState("");
  const [copied,setCopied]=useState(false);
  const [loggedIn,setLoggedIn]=useState(false);
  const [lv,setLv]=useState("login");
  const [form,setForm]=useState({name:"",email:"",password:""});
  const [ferr,setFerr]=useState("");
  const [user,setUser]=useState(null);
  const [pi,setPi]=useState(0);
  const [showAns,setShowAns]=useState(false);
  const [score,setScore]=useState({c:0,t:0});
  const [showPrint,setShowPrint]=useState(false);

  const S=STEPS[si];
  const allP=STEPS.flatMap(s=>s.practice.map(p=>({...p,code:s.code,color:s.color,emoji:s.emoji,light:s.light})));
  const curP=allP[pi%allP.length];

  const toast2=(m)=>{setToast(m);setTimeout(()=>setToast(""),2200);};
  const doSpeak=(t)=>{setSpk(true);speak(t);setTimeout(()=>setSpk(false),2000);};
  const like=(id)=>{if(liked.includes(id)){setLiked(p=>p.filter(x=>x!==id));setIdeas(p=>p.map(i=>i.id===id?{...i,likes:i.likes-1}:i));}else{setLiked(p=>[...p,id]);setIdeas(p=>p.map(i=>i.id===id?{...i,likes:i.likes+1}:i));}};
  const post=()=>{if(!newIdea.text.trim())return;setIdeas(p=>[{id:Date.now(),author:user?user.name+" (You)":"আপনি (You)",step:newIdea.step,text:newIdea.text,en:newIdea.en,likes:0},...p]);setNewIdea(p=>({...p,text:"",en:""}));toast2("✅ Posted!");};
  const copyNotes=()=>{navigator.clipboard.writeText(STEPS.map(s=>"## "+s.title+"\n"+(notes[s.id]||"(empty)")).join("\n\n"));setCopied(true);setTimeout(()=>setCopied(false),2200);toast2("📋 Copied!");};
  const login=()=>{if(!form.email||!form.password){setFerr("Please fill all fields.");return;}const n=form.name||form.email.split("@")[0];setUser({name:n,email:form.email});setLoggedIn(true);setFerr("");toast2("👋 Welcome, "+n+"!");setTab("guide");};

  const iS={width:"100%",padding:"11px 14px",background:C.bg,border:"1.5px solid "+C.border,borderRadius:10,color:C.text,fontSize:14,fontFamily:"Georgia,serif",marginBottom:12,boxSizing:"border-box"};

  // Header
  const header=h("header",{style:{background:"linear-gradient(135deg,"+C.navy+" 0%,#1E4976 100%)",padding:"14px 16px 10px",boxShadow:"0 4px 20px rgba(26,53,87,.25)",position:"sticky",top:0,zIndex:100}},
    h("div",{style:{maxWidth:900,margin:"0 auto"}},
      h("div",{style:{display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:8}},
        h("div",{style:{display:"flex",alignItems:"center",gap:10}},
          h("div",{style:{background:"rgba(255,255,255,.15)",border:"2px solid rgba(255,255,255,.25)",borderRadius:12,padding:"6px 10px",fontSize:22}},"⚕️"),
          h("div",null,
            h("div",{style:{fontSize:17,fontWeight:"bold",fontFamily:"monospace",color:"#fff"}},"Dcode Ward History"),
            h("div",{style:{fontSize:9,color:"rgba(255,255,255,.6)",fontFamily:"monospace"}},"ডিকোড ওয়ার্ড হিস্ট্রি · BD & International")
          )
        ),
        h("div",{style:{display:"flex",gap:6,alignItems:"center",flexWrap:"wrap"}},
          h("div",{style:{display:"flex",background:"rgba(255,255,255,.1)",borderRadius:20,padding:3,gap:2}},
            ...["both","en","bn"].map(v=>h("button",{key:v,onClick:()=>setLang(v),style:{padding:"3px 10px",borderRadius:16,border:"none",cursor:"pointer",fontSize:10,fontWeight:"bold",background:lang===v?"#fff":"transparent",color:lang===v?C.navy:"rgba(255,255,255,.75)"}},v==="both"?"EN+বাং":v.toUpperCase()))
          ),
          h("button",{onClick:()=>setShowPrint(true),style:{padding:"5px 12px",background:"rgba(255,255,255,.12)",border:"1px solid rgba(255,255,255,.25)",color:"#fff",borderRadius:20,cursor:"pointer",fontSize:11,fontFamily:"monospace"}},"🖨 Print"),
          loggedIn
            ?h("div",{style:{display:"flex",alignItems:"center",gap:6,background:"rgba(255,255,255,.1)",border:"1px solid rgba(255,255,255,.2)",borderRadius:20,padding:"4px 12px"}},
                h("span",null,"👤"),h("span",{style:{fontSize:11,color:"#fff",fontFamily:"monospace"}},user?.name),
                h("button",{onClick:()=>{setLoggedIn(false);setUser(null);},style:{background:"none",border:"none",color:"rgba(255,255,255,.5)",cursor:"pointer",fontSize:10,fontFamily:"monospace"}},"out"))
            :h("button",{onClick:()=>setTab("login"),style:{padding:"5px 14px",background:"rgba(255,255,255,.95)",border:"none",color:C.navy,borderRadius:20,cursor:"pointer",fontSize:11,fontFamily:"monospace",fontWeight:"bold"}},"🔐 Login")
        )
      ),
      h("div",{style:{display:"flex",gap:6,marginTop:10,flexWrap:"wrap"}},
        ...["guide","practice","community","notepad"].map((t,i)=>
          h("button",{key:t,onClick:()=>setTab(t),style:{padding:"5px 14px",borderRadius:20,border:"none",cursor:"pointer",fontSize:11,fontFamily:"monospace",background:tab===t?"#fff":"rgba(255,255,255,.12)",color:tab===t?C.navy:"rgba(255,255,255,.8)",fontWeight:tab===t?"bold":"normal"}},
            ["📖 Guide","🏋️ Practice","💬 Community","📝 Notepad"][i])
        )
      )
    )
  );

  // Guide tab
  const guideTab=h("div",null,
    // Progress
    h("div",{style:{marginBottom:18}},
      h("div",{style:{display:"flex",justifyContent:"space-between",fontSize:10,fontFamily:"monospace",color:C.muted,marginBottom:5}},
        h("span",null,"STEP "+(si+1)+" / "+STEPS.length),
        h("span",{style:{color:S.color,fontWeight:"bold"}},Math.round(((si+1)/STEPS.length)*100)+"%")
      ),
      h("div",{style:{height:6,background:C.border,borderRadius:10,overflow:"hidden"}},
        h("div",{style:{height:"100%",width:((si+1)/STEPS.length*100)+"%",background:"linear-gradient(90deg,"+S.color+","+S.color+"bb)",borderRadius:10,transition:"width .4s"}})
      )
    ),
    // Pills
    h("div",{style:{display:"flex",gap:6,flexWrap:"wrap",marginBottom:18}},
      ...STEPS.map((s,i)=>h("button",{key:s.id,onClick:()=>{setSi(i);setMnem(null);},style:{padding:"5px 14px",borderRadius:20,border:"2px solid "+(i===si?s.color:C.border),background:i===si?s.color:"#fff",color:i===si?"#fff":C.muted,cursor:"pointer",fontSize:11,fontWeight:"bold",fontFamily:"monospace",boxShadow:i===si?"0 2px 10px "+s.color+"44":"none"}},s.code))
    ),
    // Card
    h("div",{style:{background:C.card,borderRadius:18,boxShadow:"0 6px 24px rgba(26,53,87,.1)",overflow:"hidden",marginBottom:16,border:"1px solid "+C.border}},
      h("div",{style:{background:"linear-gradient(135deg,"+S.color+","+S.color+"bb)",padding:"20px 22px"}},
        h("div",{style:{display:"flex",alignItems:"flex-start",justifyContent:"space-between",gap:10,flexWrap:"wrap"}},
          h("div",{style:{display:"flex",alignItems:"center",gap:12}},
            h("div",{style:{background:"rgba(255,255,255,.2)",border:"2px solid rgba(255,255,255,.3)",borderRadius:14,padding:"8px 12px",fontSize:26}},S.emoji),
            h("div",null,
              h("div",{style:{fontSize:9,fontFamily:"monospace",color:"rgba(255,255,255,.8)",letterSpacing:3,marginBottom:2}},S.code),
              h("div",{style:{fontSize:18,fontWeight:"bold",color:"#fff"}},S.title),
              (lang==="both"||lang==="bn")&&h("div",{style:{fontSize:12,color:"rgba(255,255,255,.85)",marginTop:2}},S.title_bn)
            )
          ),
          h("button",{onClick:()=>doSpeak(S.audio),style:{display:"flex",alignItems:"center",gap:6,background:"rgba(255,255,255,.2)",border:"1.5px solid rgba(255,255,255,.4)",color:"#fff",borderRadius:10,padding:"7px 12px",cursor:"pointer",flexShrink:0}},
            h("span",{style:{fontSize:16}},spk?"🔊":"🔉"),h("span",{style:{fontSize:9,fontFamily:"monospace"}},"PRONOUNCE")
          )
        ),
        h("p",{style:{margin:"10px 0 0",fontSize:13,lineHeight:1.7,color:"rgba(255,255,255,.9)"}},
          (lang==="en"||lang==="both")?S.subtitle:"",lang==="both"?" · ":"",(lang==="bn"||lang==="both")?S.subtitle_bn:""
        )
      ),
      h("div",{style:{padding:22}},
        h("div",{style:{fontFamily:"monospace",fontSize:9,color:C.muted,letterSpacing:3,marginBottom:10,textTransform:"uppercase"}},"🎙 Key Questions"),
        h("div",{style:{display:"flex",flexDirection:"column",gap:9}},
          ...S.prompts.map((q,i)=>h("div",{key:i,style:{display:"flex",gap:10,padding:"11px 14px",background:S.light,borderRadius:11,borderLeft:"4px solid "+S.color,alignItems:"flex-start"}},
            h("span",{style:{background:S.color,color:"#fff",borderRadius:"50%",width:20,height:20,display:"flex",alignItems:"center",justifyContent:"center",fontSize:10,fontWeight:"bold",flexShrink:0,marginTop:2}},i+1),
            h("div",{style:{flex:1}},
              (lang==="en"||lang==="both")&&h("div",{style:{fontSize:13,fontStyle:"italic",color:C.text,lineHeight:1.5}},'"'+q.en+'"'),
              (lang==="bn"||lang==="both")&&h("div",{style:{fontSize:12,color:S.color,marginTop:lang==="both"?2:0,lineHeight:1.5}},'"'+q.bn+'"')
            ),
            h("button",{onClick:()=>doSpeak(q.en),style:{background:"none",border:"none",cursor:"pointer",fontSize:14,opacity:.5}},"🔊")
          ))
        ),
        h("div",{style:{background:"#FFFBF0",border:"1px solid #F5D87A",borderRadius:11,padding:"12px 16px",marginTop:16}},
          h("div",{style:{fontFamily:"monospace",fontSize:9,color:"#B7841A",letterSpacing:3,marginBottom:5}},"💡 CLINICAL TIP"),
          (lang==="en"||lang==="both")&&h("p",{style:{margin:0,fontSize:13,color:"#5C4A00",lineHeight:1.7}},S.tip.en),
          (lang==="bn"||lang==="both")&&h("p",{style:{margin:lang==="both"?"5px 0 0":0,fontSize:12,color:"#7A6010",lineHeight:1.7}},S.tip.bn)
        ),
        ...S.mnemonics.map(m=>h("div",{key:m.name,style:{marginTop:16}},
          h("button",{onClick:()=>setMnem(mnem===m.name?null:m.name),style:{display:"flex",alignItems:"center",gap:8,background:S.light,border:"2px solid "+S.color+"44",borderRadius:11,padding:"10px 16px",cursor:"pointer",width:"100%",textAlign:"left"}},
            h("span",{style:{fontSize:16}},"🧠"),
            h("span",{style:{fontFamily:"monospace",fontWeight:"bold",color:S.color,fontSize:12}},"MNEMONIC: "+m.name),
            h("span",{style:{marginLeft:"auto",color:S.color,fontSize:11}},mnem===m.name?"▲ Hide":"▼ Reveal")
          ),
          mnem===m.name&&h("div",{style:{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(100px,1fr))",gap:8,marginTop:10}},
            ...m.items.map((it,j)=>h("button",{key:j,onClick:()=>doSpeak(it),style:{background:S.light,border:"1.5px solid "+S.color+"44",borderRadius:11,padding:"10px 8px",textAlign:"center",cursor:"pointer"}},
              h("div",{style:{fontFamily:"monospace",fontSize:20,fontWeight:"bold",color:S.color}},it[0]),
              h("div",{style:{fontSize:10,color:C.muted,marginTop:2}},it),
              h("div",{style:{fontSize:9,color:S.color,marginTop:3,opacity:.7}},"🔊 tap")
            ))
          )
        ))
      )
    ),
    h("div",{style:{display:"flex",gap:10,justifyContent:"space-between"}},
      h("button",{onClick:()=>{setSi(Math.max(0,si-1));setMnem(null);},disabled:si===0,style:{padding:"10px 20px",borderRadius:11,border:"2px solid "+C.border,background:"#fff",color:si===0?C.border:C.text,cursor:si===0?"not-allowed":"pointer",fontFamily:"monospace",fontWeight:"bold",fontSize:12}},"← Back"),
      h("button",{onClick:()=>{setSi(Math.min(STEPS.length-1,si+1));setMnem(null);},disabled:si===STEPS.length-1,style:{padding:"10px 24px",borderRadius:11,border:"none",background:si===STEPS.length-1?"#ccc":"linear-gradient(135deg,"+S.color+","+S.color+"bb)",color:"#fff",cursor:si===STEPS.length-1?"not-allowed":"pointer",fontFamily:"monospace",fontWeight:"bold",fontSize:12,boxShadow:si===STEPS.length-1?"none":"0 3px 12px "+S.color+"44"}},"Next Step →")
    ),
    h("div",{style:{marginTop:22,background:C.card,borderRadius:14,padding:"16px 18px",boxShadow:"0 3px 14px rgba(26,53,87,.07)",border:"1px solid "+C.border}},
      h("div",{style:{fontFamily:"monospace",fontSize:9,color:C.muted,letterSpacing:3,marginBottom:12,textTransform:"uppercase"}},"📍 Full History Flow"),
      h("div",{style:{display:"flex",alignItems:"center",flexWrap:"wrap",gap:5}},
        ...STEPS.map((s,i)=>h("div",{key:s.id,style:{display:"flex",alignItems:"center"}},
          h("button",{onClick:()=>{setSi(i);setMnem(null);},style:{display:"flex",flexDirection:"column",alignItems:"center",gap:3,background:i===si?s.color:C.lightBg,border:"2px solid "+(i===si?s.color:C.border),borderRadius:11,padding:"8px 10px",cursor:"pointer",minWidth:52,transition:"all .2s",boxShadow:i===si?"0 2px 10px "+s.color+"44":"none"}},
            h("span",{style:{fontSize:16}},s.emoji),
            h("span",{style:{fontFamily:"monospace",fontSize:9,fontWeight:"bold",color:i===si?"#fff":s.color}},s.code)
          ),
          i<STEPS.length-1&&h("div",{style:{width:12,height:2,background:C.border,flexShrink:0}})
        ))
      )
    )
  );

  // Practice tab
  const practiceTab=h("div",null,
    h("div",{style:{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:18,flexWrap:"wrap",gap:10}},
      h("div",null,
        h("h2",{style:{fontFamily:"monospace",color:C.navy,margin:0,fontSize:14,letterSpacing:2,textTransform:"uppercase"}},"🏋️ Practice Mode"),
        h("p",{style:{color:C.muted,fontSize:11,margin:"3px 0 0",fontFamily:"monospace"}},"Real ward scenarios — think before you reveal")
      ),
      h("div",{style:{background:C.card,border:"2px solid "+C.lime,borderRadius:12,padding:"7px 18px",textAlign:"center"}},
        h("div",{style:{fontFamily:"monospace",fontSize:10,color:C.muted}},"SCORE"),
        h("div",{style:{fontFamily:"monospace",fontSize:20,fontWeight:"bold",color:C.lime}},score.c+"/"+score.t)
      )
    ),
    h("div",{style:{background:C.card,borderRadius:18,border:"2px solid "+curP.color+"33",boxShadow:"0 5px 20px rgba(26,53,87,.1)",overflow:"hidden",marginBottom:18}},
      h("div",{style:{background:curP.light,borderBottom:"2px solid "+curP.color+"22",padding:"12px 20px",display:"flex",alignItems:"center",gap:10}},
        h("span",{style:{fontSize:18}},curP.emoji),
        h("span",{style:{fontFamily:"monospace",fontWeight:"bold",color:curP.color,fontSize:12}},curP.code),
        h("span",{style:{fontFamily:"monospace",fontSize:10,color:C.muted}},"CASE #"+((pi%allP.length)+1)+" of "+allP.length)
      ),
      h("div",{style:{padding:22}},
        h("div",{style:{fontFamily:"monospace",fontSize:9,color:C.muted,letterSpacing:3,marginBottom:8}},"📋 SCENARIO"),
        h("p",{style:{fontSize:15,lineHeight:1.7,color:C.text,background:C.lightBg,borderRadius:11,padding:"14px 18px",border:"1px solid "+C.border,margin:"0 0 18px"}},curP.scenario),
        !showAns
          ?h("button",{onClick:()=>setShowAns(true),style:{width:"100%",padding:"13px",background:"linear-gradient(135deg,"+curP.color+","+curP.color+"bb)",border:"none",borderRadius:11,color:"#fff",fontWeight:"bold",fontSize:13,cursor:"pointer",fontFamily:"monospace"}},"💡 Reveal Best Approach")
          :h("div",null,
              h("div",{style:{fontFamily:"monospace",fontSize:9,color:C.lime,letterSpacing:3,marginBottom:8}},"✅ SUGGESTED APPROACH"),
              h("div",{style:{background:"#EAF6EF",border:"1.5px solid "+C.lime,borderRadius:11,padding:"14px 18px",fontSize:14,lineHeight:1.7,color:"#2D6A4F",marginBottom:16}},curP.answer),
              h("div",{style:{display:"flex",gap:10}},
                h("button",{onClick:()=>{setScore(p=>({c:p.c+1,t:p.t+1}));setShowAns(false);setPi(i=>i+1);},style:{flex:1,padding:"11px",background:"#EAF6EF",border:"2px solid "+C.lime,color:C.lime,borderRadius:11,cursor:"pointer",fontFamily:"monospace",fontWeight:"bold",fontSize:12}},"✅ Got it!"),
                h("button",{onClick:()=>{setScore(p=>({...p,t:p.t+1}));setShowAns(false);setPi(i=>i+1);},style:{flex:1,padding:"11px",background:"#FAEAEE",border:"2px solid "+C.rose,color:C.rose,borderRadius:11,cursor:"pointer",fontFamily:"monospace",fontWeight:"bold",fontSize:12}},"❌ Need more practice")
              )
            )
      )
    ),
    h("div",{style:{background:C.card,borderRadius:14,border:"1px solid "+C.border,overflow:"hidden"}},
      h("div",{style:{padding:"11px 18px",borderBottom:"1px solid "+C.border,fontFamily:"monospace",fontSize:10,color:C.muted,letterSpacing:2,background:C.lightBg}},"ALL SCENARIOS ("+allP.length+")"),
      ...allP.map((p,i)=>h("div",{key:i,onClick:()=>{setPi(i);setShowAns(false);},style:{padding:"11px 18px",borderBottom:"1px solid "+C.border,cursor:"pointer",display:"flex",alignItems:"center",gap:10,background:i===pi%allP.length?p.light:"transparent"}},
        h("span",{style:{fontSize:14}},p.emoji),
        h("span",{style:{fontFamily:"monospace",fontSize:10,color:p.color,minWidth:32,fontWeight:"bold"}},p.code),
        h("span",{style:{fontSize:12,color:C.muted,flex:1}},p.scenario),
        i===pi%allP.length&&h("span",{style:{color:p.color,fontSize:11}},"▶")
      ))
    )
  );

  // Community tab
  const communityTab=h("div",null,
    h("h2",{style:{fontFamily:"monospace",color:C.navy,margin:"0 0 4px",fontSize:14,letterSpacing:2,textTransform:"uppercase"}},"💬 Student Tips"),
    h("p",{style:{color:C.muted,fontSize:11,marginBottom:18}},"শিক্ষার্থীদের টিপস শেয়ার করুন · Share your ward tricks"),
    h("div",{style:{background:C.card,borderRadius:14,border:"1px solid "+C.border,padding:20,marginBottom:20}},
      h("div",{style:{fontFamily:"monospace",fontSize:10,color:C.muted,letterSpacing:2,marginBottom:12,textTransform:"uppercase"}},"✍️ Post Your Idea"),
      h("select",{value:newIdea.step,onChange:e=>setNewIdea(p=>({...p,step:e.target.value})),style:{width:"100%",padding:"9px 12px",background:C.bg,border:"1.5px solid "+C.border,borderRadius:9,color:C.text,fontSize:12,fontFamily:"monospace",marginBottom:10,boxSizing:"border-box"}},
        ...STEPS.map(s=>h("option",{key:s.id,value:s.code},s.code+" — "+s.title))
      ),
      h("textarea",{value:newIdea.text,onChange:e=>setNewIdea(p=>({...p,text:e.target.value})),placeholder:"বাংলায় বা ইংরেজিতে আপনার টিপস লিখুন...",rows:2,style:{width:"100%",padding:"10px 12px",background:C.bg,border:"1.5px solid "+C.border,borderRadius:9,color:C.text,fontSize:13,fontFamily:"Georgia,serif",resize:"vertical",boxSizing:"border-box",marginBottom:8}}),
      h("textarea",{value:newIdea.en,onChange:e=>setNewIdea(p=>({...p,en:e.target.value})),placeholder:"(Optional) English translation...",rows:2,style:{width:"100%",padding:"10px 12px",background:C.bg,border:"1.5px solid "+C.border,borderRadius:9,color:C.muted,fontSize:12,fontFamily:"Georgia,serif",resize:"vertical",boxSizing:"border-box",marginBottom:12}}),
      h("button",{onClick:post,style:{padding:"9px 22px",background:"linear-gradient(135deg,"+C.navy+",#1E4976)",color:"#fff",border:"none",borderRadius:9,cursor:"pointer",fontFamily:"monospace",fontWeight:"bold",fontSize:12}},"POST →")
    ),
    h("div",{style:{display:"flex",flexDirection:"column",gap:10}},
      ...ideas.map(idea=>{
        const s=STEPS.find(x=>x.code===idea.step);
        return h("div",{key:idea.id,style:{background:C.card,borderRadius:12,padding:18,border:"1px solid "+C.border,borderLeft:"4px solid "+(s?.color||"#999")}},
          h("div",{style:{display:"flex",alignItems:"center",gap:8,marginBottom:8,flexWrap:"wrap"}},
            h("span",{style:{background:s?.color,color:"#fff",borderRadius:5,padding:"2px 10px",fontFamily:"monospace",fontSize:10,fontWeight:"bold"}},idea.step),
            h("span",{style:{fontFamily:"monospace",fontSize:11,color:C.muted}},"by "+idea.author)
          ),
          h("p",{style:{margin:"0 0 5px",fontSize:14,lineHeight:1.7,color:C.text}},idea.text),
          idea.en&&h("p",{style:{margin:"0 0 10px",fontSize:12,lineHeight:1.6,color:C.muted,fontStyle:"italic"}},idea.en),
          h("button",{onClick:()=>like(idea.id),style:{display:"flex",alignItems:"center",gap:5,background:liked.includes(idea.id)?"#FAEAEE":"#F4F8FC",border:"1px solid "+(liked.includes(idea.id)?C.rose:C.border),borderRadius:18,padding:"4px 12px",cursor:"pointer",color:liked.includes(idea.id)?C.rose:C.muted,fontSize:12,fontFamily:"monospace"}},
            liked.includes(idea.id)?"❤️":"🤍"," "+idea.likes
          )
        );
      })
    )
  );

  // Notepad tab
  const notepadTab=h("div",null,
    h("div",{style:{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:18,flexWrap:"wrap",gap:10}},
      h("div",null,
        h("h2",{style:{fontFamily:"monospace",color:C.navy,margin:0,fontSize:14,letterSpacing:2,textTransform:"uppercase"}},"📝 Patient Notepad"),
        h("p",{style:{color:C.muted,fontSize:11,margin:"3px 0 0",fontFamily:"monospace"}},(loggedIn?"Saving as "+user?.name+" · ":"Login to save · ")+"রোগীর নোট")
      ),
      h("button",{onClick:copyNotes,style:{padding:"8px 18px",background:copied?C.lime:C.navy,color:"#fff",border:"none",borderRadius:9,cursor:"pointer",fontFamily:"monospace",fontSize:11,fontWeight:"bold",transition:"background .3s"}},copied?"✓ Copied!":"⬆ Copy All")
    ),
    !loggedIn&&h("div",{style:{background:"#FFFBF0",border:"1px solid #F5D87A",borderRadius:11,padding:"11px 16px",marginBottom:18,display:"flex",alignItems:"center",gap:10}},
      h("span",{style:{fontSize:18}},"🔐"),
      h("div",{style:{flex:1}},
        h("div",{style:{color:"#B7841A",fontFamily:"monospace",fontSize:11,fontWeight:"bold"}},"Login to save notes permanently"),
        h("div",{style:{color:C.muted,fontSize:11,marginTop:2}},"Notes only last this session")
      ),
      h("button",{onClick:()=>setTab("login"),style:{padding:"6px 14px",background:"#F5A62322",border:"1px solid "+C.amber,color:C.amber,borderRadius:9,cursor:"pointer",fontFamily:"monospace",fontSize:11,fontWeight:"bold"}},"Login →")
    ),
    h("div",{style:{display:"flex",flexDirection:"column",gap:12}},
      ...STEPS.map(s=>h("div",{key:s.id,style:{background:C.card,borderRadius:12,overflow:"hidden",border:"1px solid "+C.border}},
        h("div",{style:{background:"linear-gradient(135deg,"+s.color+","+s.color+"bb)",padding:"9px 16px",display:"flex",alignItems:"center",gap:7}},
          h("span",{style:{fontSize:14}},s.emoji),
          h("div",null,
            h("span",{style:{fontFamily:"monospace",fontWeight:"bold",fontSize:12,color:"#fff"}},s.code+" — "+s.title),
            h("div",{style:{fontSize:9,color:"rgba(255,255,255,.75)"}},s.title_bn)
          )
        ),
        h("textarea",{value:notes[s.id]||"",onChange:e=>setNotes(p=>({...p,[s.id]:e.target.value})),placeholder:"Notes for "+s.title+" · "+s.title_bn+"...",rows:3,style:{width:"100%",padding:"12px 16px",border:"none",fontFamily:"Georgia,serif",fontSize:13,lineHeight:1.7,resize:"vertical",boxSizing:"border-box",color:C.text,background:C.lightBg}})
      ))
    )
  );

  // Login tab
  const loginTab=h("div",{style:{display:"flex",alignItems:"center",justifyContent:"center",minHeight:"55vh"}},
    h("div",{style:{background:C.surface,border:"1px solid "+C.border,borderRadius:18,padding:32,width:"100%",maxWidth:400,boxShadow:"0 8px 36px rgba(26,53,87,.12)"}},
      h("div",{style:{textAlign:"center",marginBottom:24}},
        h("div",{style:{fontSize:36,marginBottom:7}},"🔐"),
        h("div",{style:{fontSize:18,fontWeight:"bold",fontFamily:"monospace",color:C.navy}},lv==="login"?"Welcome Back":"Create Account"),
        h("div",{style:{fontSize:11,color:C.muted,marginTop:3}},"Save your notes across sessions")
      ),
      ferr&&h("div",{style:{background:"#FEE8ED",border:"1px solid #F8B4C2",color:C.rose,borderRadius:7,padding:"7px 12px",fontSize:11,marginBottom:12,textAlign:"center"}},ferr),
      lv==="signup"&&h("input",{value:form.name,onChange:e=>setForm(p=>({...p,name:e.target.value})),placeholder:"Your name",style:iS}),
      h("input",{value:form.email,onChange:e=>setForm(p=>({...p,email:e.target.value})),placeholder:"Email address",type:"email",style:iS}),
      h("input",{value:form.password,onChange:e=>setForm(p=>({...p,password:e.target.value})),placeholder:"Password",type:"password",style:{...iS,marginBottom:20}}),
      h("button",{onClick:login,style:{width:"100%",padding:"12px",background:"linear-gradient(135deg,"+C.navy+",#1E4976)",border:"none",borderRadius:11,color:"#fff",fontWeight:"bold",fontSize:14,cursor:"pointer",fontFamily:"monospace",boxShadow:"0 4px 16px rgba(26,53,87,.25)"}},lv==="login"?"🔐 Login":"🚀 Create Account"),
      h("div",{style:{textAlign:"center",marginTop:14,fontSize:12,color:C.muted}},
        lv==="login"?"Don't have an account? ":"Already have an account? ",
        h("button",{onClick:()=>{setLv(lv==="login"?"signup":"login");setFerr("");},style:{background:"none",border:"none",color:C.teal,cursor:"pointer",fontSize:12,fontFamily:"monospace",textDecoration:"underline"}},lv==="login"?"Sign Up":"Login")
      )

  // Print sheet
  const printSheet=showPrint&&h("div",{style:{position:"fixed",inset:0,background:"rgba(0,0,0,.55)",zIndex:1000,display:"flex",alignItems:"center",justifyContent:"center",padding:14}},
    h("div",{style:{background:"#fff",borderRadius:16,maxWidth:700,width:"100%",maxHeight:"90vh",overflow:"auto",boxShadow:"0 20px 60px rgba(0,0,0,.25)"}},
      h("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"12px 20px",background:C.navy,borderRadius:"16px 16px 0 0"}},
        h("span",{style:{color:"#fff",fontFamily:"monospace",fontWeight:"bold",fontSize:13}},"⚕️ Dcode Ward History · Cheat Sheet"),
        h("button",{onClick:()=>setShowPrint(false),style:{background:"rgba(255,255,255,.15)",border:"none",color:"#fff",borderRadius:7,padding:"5px 12px",cursor:"pointer",fontSize:12}},"✕ Close")
      ),
      h("div",{style:{padding:22}},
        h("div",{style:{textAlign:"center",marginBottom:16}},
          h("div",{style:{fontSize:20,fontWeight:"bold",color:C.navy,fontFamily:"Georgia,serif"}},"⚕️ Dcode Ward History"),
          h("div",{style:{fontSize:10,color:"#888",marginTop:2}},"Patient History-Taking · Ward Quick Reference · EN + বাংলা")
        ),
        h("div",{style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}},
          ...STEPS.map(s=>h("div",{key:s.id,style:{border:"2px solid "+s.color,borderRadius:9,overflow:"hidden"}},
            h("div",{style:{background:s.color,padding:"7px 11px",display:"flex",gap:7,alignItems:"center"}},
              h("span",{style:{fontSize:14}},s.emoji),
              h("div",null,
                h("div",{style:{color:"#fff",fontWeight:"bold",fontSize:11}},s.code+" — "+s.title),
                h("div",{style:{color:"rgba(255,255,255,.85)",fontSize:8}},s.title_bn)
              )
            ),
            h("div",{style:{padding:"9px 11px",background:"#fafafa"}},
              ...s.prompts.slice(0,3).map((p,i)=>h("div",{key:i,style:{borderLeft:"3px solid "+s.color,paddingLeft:6,marginBottom:4}},
                h("div",{style:{fontSize:9,color:"#222",lineHeight:1.4}},p.en),
                h("div",{style:{fontSize:8,color:"#777"}},p.bn)
              )),
              ...s.mnemonics.map(m=>h("div",{key:m.name,style:{marginTop:6,background:s.color+"18",borderRadius:5,padding:"4px 8px"}},
                h("div",{style:{fontSize:8,fontWeight:"bold",color:s.color,marginBottom:2}},"🧠 "+m.name),
                h("div",{style:{display:"flex",flexWrap:"wrap",gap:2}},
                  ...m.items.map((it,j)=>h("span",{key:j,style:{background:s.color,color:"#fff",borderRadius:3,padding:"1px 5px",fontSize:7}},h("b",null,it[0]),it.slice(1)))
                )
              )),
              h("div",{style:{marginTop:5,fontSize:8,color:"#555",fontStyle:"italic",borderTop:"1px dashed #e0e0e0",paddingTop:4}},"💡 "+s.tip.en)
            )
          ))
        ),
        h("div",{style:{marginTop:12,textAlign:"center",fontSize:8,color:"#aaa",borderTop:"1px solid #eee",paddingTop:8}},"Dcode Ward History · Created by Maria Sultana Hira · Always verify with your clinical supervisor")
      ),
      h("div",{style:{padding:"11px 20px",borderTop:"1px solid #eee",display:"flex",gap:8,justifyContent:"flex-end",background:"#f9f9f9",borderRadius:"0 0 16px 16px"}},
        h("button",{onClick:()=>window.print(),style:{padding:"9px 24px",background:C.teal,color:"#fff",border:"none",borderRadius:9,cursor:"pointer",fontWeight:"bold",fontSize:13}},"🖨 Print / Save PDF")
      )
    )
  );

  return h("div",{style:{fontFamily:"Georgia,serif",background:C.bg,minHeight:"100vh",color:C.text}},
    toast&&h("div",{style:{position:"fixed",top:16,left:"50%",transform:"translateX(-50%)",background:C.navy,color:"#fff",border:"1px solid "+C.teal,padding:"9px 22px",borderRadius:28,zIndex:3000,fontFamily:"monospace",fontSize:12,boxShadow:"0 5px 20px rgba(0,0,0,.15)",whiteSpace:"nowrap"}},toast),
    printSheet,
    header,
    h("div",{style:{maxWidth:900,margin:"0 auto",padding:"20px 14px 46px"}},
      tab==="guide"&&guideTab,
      tab==="practice"&&practiceTab,
      tab==="community"&&communityTab,
      tab==="notepad"&&notepadTab,
      tab==="login"&&loginTab
    ),
    h("footer",{style:{textAlign:"center",padding:"14px",fontFamily:"monospace",fontSize:10,color:C.muted,borderTop:"1px solid "+C.border,background:C.surface}},
      h("span",{style:{color:C.teal,fontWeight:"bold"}},"⚕️ Dcode Ward History"),
      " · Created by ",
      h("span",{style:{color:C.navy,fontWeight:"bold"}},"Maria Sultana Hira"),
      " · Always verify with your clinical supervisor"
    )
  );
}

const root=ReactDOM.createRoot(document.getElementById("root"));
root.render(React.createElement(App));
</script>
</body>
