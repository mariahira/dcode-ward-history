// Post idea to Supabase
async function postIdea(){
  if(!state.user){showToast("🔐 Please login to post!");return;}
  if(!state.newText.trim())return;
  const idea={
    author:state.user.name,
    step:state.newStep,
    text:state.newText,
    bn:state.newEn||"",
    likes:0,
    user_id:state.user.id||state.user.email
  };
  const{data,error}=await _sb.from("ideas").insert([idea]).select();
  if(!error&&data){
    state.ideas=[data[0],...state.ideas];
    state.newText="";state.newEn="";

    state.ideas=[{id:Date.now(),...idea},...state.ideas];
    state.newText="";state.newEn="";
    showToast("✅ Posted!");
  }
}

// Toggle like on Supabase
async function toggleLike(id,isLiked,isLoggedIn){
  if(!isLoggedIn){showToast("🔐 Please login to like!");return;}
  const uid=state.user.id||state.user.email;
  if(isLiked){
    // Unlike
    await _sb.from("likes").delete().eq("user_id",uid).eq("idea_id",id);
    state.liked=state.liked.filter(x=>x!==id);
    state.ideas=state.ideas.map(i=>i.id===id?{...i,likes:Math.max(0,(i.likes||1)-1)}:i);
    // Update likes count in ideas table
    const idea=state.ideas.find(i=>i.id===id);
    if(idea) await _sb.from("ideas").update({likes:idea.likes}).eq("id",id);
  } else {
    // Like
    const{error}=await _sb.from("likes").insert([{user_id:uid,idea_id:id}]);
    if(!error){
      state.liked=[...state.liked,id];
      state.ideas=state.ideas.map(i=>i.id===id?{...i,likes:(i.likes||0)+1}:i);
      const idea=state.ideas.find(i=>i.id===id);
      if(idea) await _sb.from("ideas").update({likes:idea.likes}).eq("id",id);
    }
  }
  save();render();
}

  if(state.user){

// Login/Signup with Supabase Auth
async function doLogin(){
  state.ferr="";
  if(!state.femail||!state.fpass){state.ferr="Please fill all fields.";render();return;}
  if(state.fpass.length<6){state.ferr="Password must be at least 6 characters.";render();return;}
  if(state.lv==="signup"&&!state.fname.trim()){state.ferr="Please enter your name.";render();return;}
  state.loading=true;render();
  let result;
  if(state.lv==="signup"){
    result=await _sb.auth.signUp({
      email:state.femail,password:state.fpass,
      options:{data:{name:state.fname}}
    });
  } else {
    result=await _sb.auth.signInWithPassword({email:state.femail,password:state.fpass});
  }
  state.loading=false;
  const{data,error}=result;
  if(error){state.ferr=error.message;render();return;}
  const sbUser=data.user;
  const name=sbUser.user_metadata?.name||state.fname||state.femail.split("@")[0];
  state.user={id:sbUser.id,name,email:sbUser.email};
  state.ferr="";state.tab="guide";
  save();
  await loadNotes();// load saved notes
  showToast("👋 Welcome, "+name+"!");
}

// Logout
function doLogout(){
  _sb.auth.signOut();
  state.user=null;save();render();

    <button id="pwa-dismiss" style="background:none;border:none;color:rgba(255,255,255,.4);font-size:18px;cursor:pointer;padding:4px;flex-shrink:0">✕</button>
    <button id="pwa-install-btn" style="background:#2E8B8B;border:none;color:#fff;border-radius:10px;padding:10px 18px;font-size:13px;font-weight:700;cursor:pointer;flex-shrink:0;white-space:nowrap">📲 Install</button>
  `;

  document.body.appendChild(banner);

  // Install button click
  document.getElementById('pwa-install-btn').addEventListener('click', async () => {
    if (_installPrompt) {
      _installPrompt.prompt();
      const { outcome } = await _installPrompt.userChoice;
      if (outcome === 'accepted') {
        hideInstallBanner();
        showToast('🎉 Installing Dcode Ward History...');
      }
      _installPrompt = null;
    } else {
      showFallbackInstall();
    }
  });

  // Dismiss button
  document.getElementById('pwa-dismiss').addEventListener('click', () => {
    hideInstallBanner();
  });

  // Also add install button to footer
  addFooterInstallBtn();
}

function hideInstallBanner() {
  const banner = document.getElementById('pwa-banner');
  if (banner) {
    banner.style.animation = 'none';
    banner.style.transform = 'translateY(100%)';
    banner.style.transition = 'transform .3s ease';
    setTimeout(() => banner.remove(), 300);
  }
}

function showFallbackInstall() {
  const modal = document.createElement('div');
  modal.id = 'pwa-fallback';
  modal.style.cssText = `
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.6);
    z-index: 3000;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    padding: 16px;
    font-family: 'Inter', 'Noto Sans Bengali', sans-serif;
  `;
  modal.innerHTML = `
    <div style="background:#fff;border-radius:20px 20px 16px 16px;width:100%;max-width:440px;overflow:hidden;box-shadow:0 -8px 40px rgba(0,0,0,.2)">
      <div style="background:#1A3255;padding:16px 20px;display:flex;align-items:center;justify-content:space-between">
        <span style="color:#fff;font-weight:700;font-size:15px">📲 Install App</span>
        <button onclick="document.getElementById('pwa-fallback').remove()" style="background:none;border:none;color:rgba(255,255,255,.6);font-size:18px;cursor:pointer">✕</button>
      </div>
      <div style="padding:20px">
        <div style="text-align:center;margin-bottom:20px">
          <div style="font-size:48px;margin-bottom:8px">⚕️</div>
          <div style="font-size:16px;font-weight:700;color:#1E2D3D;margin-bottom:4px">Dcode Ward History</div>
          <div style="font-size:12px;color:#6B8299">Install as a mobile app in seconds</div>
        </div>
        <div style="display:flex;flex-direction:column;gap:12px">
          <div style="display:flex;align-items:center;gap:12px;background:#F4F8FC;border-radius:12px;padding:12px 14px">
            <span style="font-size:22px;flex-shrink:0">1️⃣</span>
            <div>
              <div style="font-size:13px;font-weight:600;color:#1E2D3D">Open in Chrome</div>
              <div style="font-size:12px;color:#6B8299">Make sure you're using Chrome browser</div>
            </div>
          </div>
          <div style="display:flex;align-items:center;gap:12px;background:#F4F8FC;border-radius:12px;padding:12px 14px">
            <span style="font-size:22px;flex-shrink:0">2️⃣</span>
            <div>
              <div style="font-size:13px;font-weight:600;color:#1E2D3D">Tap menu <span style="background:#1A3255;color:#fff;border-radius:4px;padding:1px 6px;font-size:11px">⋮</span></div>
              <div style="font-size:12px;color:#6B8299">Top right corner of Chrome</div>
            </div>
          </div>
          <div style="display:flex;align-items:center;gap:12px;background:#F4F8FC;border-radius:12px;padding:12px 14px">
            <span style="font-size:22px;flex-shrink:0">3️⃣</span>
            <div>
              <div style="font-size:13px;font-weight:600;color:#1E2D3D">Tap "Add to Home Screen"</div>
              <div style="font-size:12px;color:#6B8299">Then tap "Add" to confirm</div>
            </div>
          </div>
        </div>
        <button onclick="document.getElementById('pwa-fallback').remove()" style="width:100%;margin-top:20px;padding:13px;background:#1A3255;color:#fff;border:none;border-radius:12px;font-weight:700;font-size:14px;cursor:pointer">Got it ✓</button>
      </div>
    </div>
  `;
  document.body.appendChild(modal);
}

function addFooterInstallBtn() {
  // Add install button to greeting tab when visible
  const checkAndAdd = () => {
    const footer = document.querySelector('.footer');
    if (footer && !document.getElementById('footer-install-btn')) {
      const btn = document.createElement('div');
      btn.id = 'footer-install-btn';
      btn.style.cssText = 'padding:12px 16px;background:#F4F8FC;border-top:1px solid #E8EEF4;text-align:center;';
      btn.innerHTML = `
        <button onclick="window._triggerInstall()" style="display:inline-flex;align-items:center;gap:8px;padding:10px 24px;background:#1A3255;color:#fff;border:none;border-radius:12px;font-size:13px;font-weight:700;cursor:pointer;font-family:'Inter',sans-serif">
          📲 Install as Mobile App
        </button>
      `;
      footer.parentNode.insertBefore(btn, footer);
    }
  };
  setTimeout(checkAndAdd, 500);
}

// Global trigger for install
window._triggerInstall = function() {
  if (_installPrompt) {
    _installPrompt.prompt();
    _installPrompt.userChoice.then(({outcome}) => {
      if (outcome === 'accepted') showToast('🎉 Installing...');
      _installPrompt = null;
    });
  } else {
    showFallbackInstall();
  }
};

// Show install hint on greeting page for first-time visitors
setTimeout(() => {
  if (!_installBannerShown && !window.matchMedia('(display-mode: standalone)').matches) {
    const isFirstVisit = !localStorage.getItem('visited');
    if (isFirstVisit) {
      localStorage.setItem('visited', '1');
      // Show subtle hint after 3 seconds
      setTimeout(() => {
        if (!_installPrompt) {
          addFooterInstallBtn();
        }
      }, 3000);
    }
  }
}, 1000);
</script>
</body>
</html>
